name = "inpriv-status"
main = "src/index.js"
compatibility_date = "2025-08-01"
workers_dev = true

routes = [
  { pattern = "status.inpriv.xyz", custom_domain = true }
]

# No cron (Free plan: 5 slots taken by temp/mail/host/fake/cordium).
# Sweeps are lazy (~4% of requests).

# Static frontend
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Storage: Google Drive folder "inpriv/.status" (user OAuth).
# snap.json + day_YYYY-MM-DD.json; replaces the old STATUS_KV.
[vars]
DRIVE_PARENT = "1yLBrRjNDorTiBgGwQ12krHavKGLshFmV"
DRIVE_FOLDER_NAME = ".status"

# Secrets (set via `npx wrangler secret put DRIVE_OAUTH`):
#   DRIVE_OAUTH — {"client_id":"…","client_secret":"…","refresh_token":"…"}
