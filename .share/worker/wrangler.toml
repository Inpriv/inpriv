name = "inpriv-share"
main = "src/index.js"
compatibility_date = "2025-08-01"
workers_dev = true

routes = [
  { pattern = "share.inpriv.xyz", custom_domain = true }
]

# No cron (Free plan: 5 slots taken by temp/mail/host/fake/cordium).
# Sweeps are lazy (~4% of requests) + manual via admin panel.

# Static frontend
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Storage: Google Drive folder "inpriv/.share" (user OAuth).
# One file per room/signal; replaces the old SHARE_KV.
[vars]
DRIVE_PARENT = "1yLBrRjNDorTiBgGwQ12krHavKGLshFmV"
DRIVE_FOLDER_NAME = ".share"

# Secrets (set via `npx wrangler secret put DRIVE_OAUTH`):
#   DRIVE_OAUTH — {"client_id":"…","client_secret":"…","refresh_token":"…"}
