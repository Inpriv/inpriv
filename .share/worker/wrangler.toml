name = "inpriv-share"
main = "src/index.js"
compatibility_date = "2025-08-01"
workers_dev = true

routes = [
  { pattern = "share.inpriv.xyz", custom_domain = true }
]

# Static frontend served from ./public
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# KV namespace for ephemeral signaling rooms
# Recreate locally: npx wrangler kv namespace create SHARE_KV
[[kv_namespaces]]
binding = "SHARE_KV"
id = "14830704f54140ae8f1eb7dd3495b229"
