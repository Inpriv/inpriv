<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com fonts.gstatic.com; script-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.googleapis.com fonts.gstatic.com https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:*; worker-src 'none'; manifest-src 'self'">
  <meta name="theme-color" content="#0f1119">
  <title>Inpriv Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <style>
    .material-symbols-rounded { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; -webkit-font-smoothing: antialiased; }
    :root {
      --bg-primary: #0f1119;
      --bg-secondary: rgba(22, 24, 34, 0.55);
      --bg-tertiary: rgba(30, 33, 44, 0.4);
      --bg-card: rgba(24, 26, 37, 0.45);
      --bg-card-hover: rgba(32, 35, 48, 0.6);
      --bg-input: rgba(18, 20, 30, 0.5);
      --bg-glass: rgba(20, 22, 32, 0.35);
      --bg-sidebar: rgba(13, 15, 22, 0.75);
      --accent: #a0a5b4;
      --accent-hover: #c4c9d4;
      --accent-glow: rgba(160, 165, 180, 0.18);
      --accent-subtle: rgba(160, 165, 180, 0.06);
      --text-primary: #e8eaef;
      --text-secondary: #9498a4;
      --text-tertiary: #6b6f7a;
      --status-success: #4ade80;
      --status-bg-success: rgba(74, 222, 128, 0.1);
      --status-error: #f87171;
      --status-bg-error: rgba(248, 113, 113, 0.1);
      --status-warning: #fbbf24;
      --status-bg-warning: rgba(251, 191, 36, 0.1);
      --border: rgba(255, 255, 255, 0.07);
      --border-light: rgba(255, 255, 255, 0.13);
      --border-glass: rgba(255, 255, 255, 0.10);
      --gradient-primary: linear-gradient(135deg, #8b8fa0, #6b6f7e);
      --gradient-bg: linear-gradient(170deg, #0a0c14 0%, #11141f 30%, #161925 60%, #0f1119 100%);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 12px rgba(0,0,0,0.25);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.35);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.5);
      --shadow-glass: 0 4px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
      --sidebar-width: 240px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gradient-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient orbs */
    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(160,165,180,0.08) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(80,85,100,0.06) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-width);
      min-height: 100vh;
      background: var(--bg-sidebar);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      padding: 0;
    }

    .sidebar-brand {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #d4d8e2 0%, #8b8fa0 55%, #6b6f7e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .sidebar-subtitle {
      font-size: 11px;
      color: var(--text-tertiary);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 12px;
      overflow-y: auto;
    }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 16px 12px 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 2px;
      position: relative;
    }
    .nav-item:hover {
      background: var(--accent-subtle);
      color: var(--text-primary);
    }
    .nav-item.active {
      background: rgba(160, 165, 180, 0.1);
      color: var(--text-primary);
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }
    .nav-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-icon svg {
      width: 18px;
      height: 18px;
    }
    .nav-badge {
      margin-left: auto;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }
    .nav-badge.online {
      background: var(--status-bg-success);
      color: var(--status-success);
    }
    .nav-badge.offline {
      background: var(--status-bg-error);
      color: var(--status-error);
    }
    .nav-badge.eu-block {
      background: var(--status-bg-warning);
      color: var(--status-warning);
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .sidebar-version {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-success);
    }

    /* ── Main content ─────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      position: relative;
      z-index: 1;
      padding: 32px 40px;
      max-width: 1100px;
    }

    /* ── Header ───────────────────────────────────────── */
    .page-header {
      margin-bottom: 32px;
    }
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    /* ── Toggle Switch ─────────────────────────────────── */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 24px;
      transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: var(--text-primary);
      border-radius: 50%;
      transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .toggle input:checked + .toggle-slider {
      background: var(--status-error);
    }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }
    .toggle-sm {
      width: 36px;
      height: 20px;
    }
    .toggle-sm .toggle-slider::before {
      width: 14px;
      height: 14px;
    }
    .toggle-sm input:checked + .toggle-slider::before {
      transform: translateX(16px);
    }

    /* ── Cards ─────────────────────────────────────────── */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
      transition: all 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .card:hover {
      background: var(--bg-card-hover);
    }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-body {
      padding: 24px;
    }

    /* ── EU Block Banner ──────────────────────────────── */
    .eu-banner {
      background: var(--status-bg-error);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideDown 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .eu-banner-icon {
      width: 40px;
      height: 40px;
      background: rgba(248, 113, 113, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .eu-banner-content {
      flex: 1;
    }
    .eu-banner-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--status-error);
    }
    .eu-banner-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ── Service Grid ─────────────────────────────────── */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .service-card {
      cursor: pointer;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .service-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .service-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-subtle);
      border: 1px solid var(--border);
    }
    .service-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: var(--radius-full);
    }
    .service-status.online {
      background: var(--status-bg-success);
      color: var(--status-success);
    }
    .service-status.offline {
      background: var(--status-bg-error);
      color: var(--status-error);
    }
    .service-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .service-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .service-domain {
      font-size: 13px;
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', monospace;
    }
    .service-meta {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .service-tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: var(--accent-subtle);
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .service-tag.eu-blocked {
      background: var(--status-bg-error);
      color: var(--status-error);
    }
    .service-tag.eu-safe {
      background: var(--status-bg-success);
      color: var(--status-success);
    }

    /* ── Back button ──────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      background: rgba(24,26,37,0.5);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .back-btn:hover {
      background: rgba(32,35,48,0.6);
      color: var(--text-primary);
    }

    /* ── Forms ────────────────────────────────────────── */
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-input::placeholder {
      color: var(--text-tertiary);
    }
    .form-input-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }
    .form-hint {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }
    .form-row {
      display: flex;
      gap: 16px;
    }
    .form-row .form-group {
      flex: 1;
    }

    .form-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .form-toggle-row:last-child {
      border-bottom: none;
    }
    .form-toggle-label {
      font-size: 14px;
      color: var(--text-primary);
    }
    .form-toggle-desc {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* ── Buttons ──────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
      border: none;
      font-family: 'Inter', sans-serif;
    }
    .btn-primary {
      background: var(--gradient-primary);
      color: #fff;
      box-shadow: 0 4px 16px rgba(107,111,126,0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 24px rgba(107,111,126,0.45);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(24,26,37,0.5);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .btn-secondary:hover {
      background: rgba(32,35,48,0.6);
    }
    .btn-danger {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: var(--status-error);
    }
    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.25);
    }
    .btn-sm {
      padding: 6px 14px;
      font-size: 12px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* ── Toast ────────────────────────────────────────── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 12px 20px;
      border-radius: var(--radius-md);
      background: rgba(22,24,34,0.9);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--border-light);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      font-size: 14px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      min-width: 280px;
    }
    .toast-success { border-left: 3px solid var(--status-success); }
    .toast-error { border-left: 3px solid var(--status-error); }
    .toast-warning { border-left: 3px solid var(--status-warning); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .view {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .view.active {
      display: block;
    }

    /* ── Loading shimmer ──────────────────────────────── */
    .shimmer {
      background: linear-gradient(90deg, rgba(30,33,44,0.3) 25%, rgba(40,44,56,0.5) 50%, rgba(30,33,44,0.3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Empty state ──────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 20px; }
      .service-grid { grid-template-columns: 1fr; }
      .form-row { flex-direction: column; gap: 0; }
    }

    /* ── Scrollbar ────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <!-- ── Sidebar ──────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">Inpriv</div>
      <div class="sidebar-subtitle">Control Panel</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Overview</div>
      <div class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
        </span>
        Dashboard
      </div>

      <div class="sidebar-section-label">Services</div>
      <div id="sidebarServices"></div>

      <div class="sidebar-section-label">System</div>
      <div class="nav-item" data-view="global" onclick="switchView('global')">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </span>
        Global Settings
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-version">
        <span class="sidebar-status-dot"></span>
        <span>Panel v1.0</span>
      </div>
    </div>
  </aside>

  <!-- ── Main Content ─────────────────────────────── -->
  <main class="main" id="mainContent">
    <!-- Views are rendered here by JS -->
  </main>

  <!-- ── Toast Container ──────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ── State ────────────────────────────────────────
    let state = {
      services: {},
      global: {},
      currentView: 'dashboard',
      currentService: null,
      loading: true
    };

    // ── Service icons (inline SVG) ──────────────────
    const SERVICE_ICONS = {
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
      totp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>',
      pay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
      zero: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
      hush: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      osint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><path d="M11 8v3l2 1"/></svg>'
    };

    const SERVICE_NAMES = {
      mail: 'Inpriv Mail',
      totp: 'Inpriv TOTP',
      pay: 'Inpriv Pay',
      zero: 'Zero Wallet',
      hush: 'Inpriv Hush',
      osint: 'Inpriv OSINT'
    };

    // ── API helpers ──────────────────────────────────
    async function apiGet(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`GET ${path} returned ${res.status}`);
      return res.json();
    }

    async function apiPut(path, body) {
      const res = await fetch(path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`PUT ${path} returned ${res.status}`);
      return res.json();
    }

    async function apiPost(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`POST ${path} returned ${res.status}`);
      return res.json();
    }

    // ── Toast ─────────────────────────────────────────
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icons = {
        success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        warning: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
      };
      toast.innerHTML = `${icons[type] || ''} ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ── Data loading ──────────────────────────────────
    async function loadData() {
      try {
        const [servicesRes, globalRes] = await Promise.all([
          apiGet('/api/services'),
          apiGet('/api/global')
        ]);
        state.services = servicesRes.services || {};
        state.global = globalRes.global || {};
        state.loading = false;
        renderSidebar();
        renderCurrentView();
      } catch (e) {
        state.loading = false;
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><span class="material-symbols-rounded" style="font-size:48px;color:var(--status-error)">cloud_off</span></div>
            <h2 style="color:var(--status-error);margin-bottom:8px;">Connection Error</h2>
            <p style="color:var(--text-secondary);">Could not reach the panel API. Make sure the server is running.</p>
            <button class="btn btn-secondary" style="margin-top:16px;" onclick="loadData()">Retry</button>
          </div>
        `;
      }
    }

    // ── Sidebar ───────────────────────────────────────
    function renderSidebar() {
      const container = document.getElementById('sidebarServices');
      container.innerHTML = '';
      const serviceKeys = ['mail', 'totp', 'pay', 'zero', 'hush', 'osint'];
      serviceKeys.forEach(key => {
        const svc = state.services[key];
        if (!svc) return;
        const div = document.createElement('div');
        div.className = 'nav-item';
        div.dataset.view = 'service';
        div.dataset.service = key;
        div.onclick = () => switchView('service', key);
        div.innerHTML = `
          <span class="nav-icon">${SERVICE_ICONS[key] || ''}</span>
          ${SERVICE_NAMES[key] || key}
          <span class="nav-badge ${svc.enabled ? 'online' : 'offline'}">${svc.enabled ? 'ON' : 'OFF'}</span>
        `;
        container.appendChild(div);
      });
    }

    // ── View switching ────────────────────────────────
    function switchView(view, serviceKey) {
      state.currentView = view;
      state.currentService = serviceKey || null;

      // Update sidebar active state
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if (view === 'dashboard') {
        document.querySelector('[data-view="dashboard"]')?.classList.add('active');
      } else if (view === 'global') {
        document.querySelector('[data-view="global"]')?.classList.add('active');
      } else if (view === 'service' && serviceKey) {
        document.querySelector(`[data-service="${serviceKey}"]`)?.classList.add('active');
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      const main = document.getElementById('mainContent');
      if (state.loading) {
        main.innerHTML = `<div class="empty-state"><div class="shimmer" style="width:300px;height:24px;margin:0 auto 16px;"></div><div class="shimmer" style="width:200px;height:16px;margin:0 auto;"></div></div>`;
        return;
      }
      switch (state.currentView) {
        case 'dashboard': renderDashboard(); break;
        case 'global': renderGlobal(); break;
        case 'service': renderServiceDetail(state.currentService); break;
        default: renderDashboard();
      }
    }

    // ── Dashboard ─────────────────────────────────────
    function renderDashboard() {
      const main = document.getElementById('mainContent');
      const euBlocked = state.global.block_eu_ips;
      const serviceKeys = Object.keys(state.services);

      main.innerHTML = `
        <div class="page-header">
          <div class="page-title">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Dashboard
          </div>
          <div class="page-subtitle">${serviceKeys.length} services · ${euBlocked ? 'EU IP block active' : 'EU IP block disabled'}</div>
        </div>

        ${euBlocked ? `
        <div class="eu-banner">
          <div class="eu-banner-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <div class="eu-banner-content">
            <div class="eu-banner-title">EU IP Blocking is Active</div>
            <div class="eu-banner-text">All visitors from the European Union are being blocked across all Inpriv services in response to Chat Control 2.0 regulations.</div>
          </div>
        </div>` : ''}

        <div class="service-grid" id="serviceGrid"></div>
      `;

      const grid = document.getElementById('serviceGrid');
      const order = ['mail', 'totp', 'pay', 'zero', 'hush', 'osint'];
      order.forEach(key => {
        const svc = state.services[key];
        if (!svc) return;
        const card = document.createElement('div');
        card.className = 'card service-card';
        card.onclick = () => switchView('service', key);

        const euOverride = svc.options?.block_eu_override;
        const euEffective = euBlocked && !euOverride;

        card.innerHTML = `
          <div class="service-card-top">
            <div class="service-icon">${SERVICE_ICONS[key] || ''}</div>
            <div class="service-status ${svc.enabled ? 'online' : 'offline'}">
              <span class="service-status-dot"></span>
              ${svc.enabled ? 'Online' : 'Offline'}
            </div>
          </div>
          <div class="service-name">${SERVICE_NAMES[key] || key}</div>
          <div class="service-domain">${svc.domain || '—'}</div>
          <div class="service-meta">
            <span class="service-tag">${key}</span>
            ${euEffective ? '<span class="service-tag eu-blocked"><span class="material-symbols-rounded" style="font-size:12px;vertical-align:-2px">block</span> EU Blocked</span>' : '<span class="service-tag eu-safe"><span class="material-symbols-rounded" style="font-size:12px;vertical-align:-2px">check</span> EU Allowed</span>'}
            ${svc.port ? `<span class="service-tag">Port ${svc.port}</span>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ── Global Settings ────────────────────────────────
    function renderGlobal() {
      const main = document.getElementById('mainContent');
      const g = state.global;

      main.innerHTML = `
        <div class="page-header">
          <div class="page-title">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Global Settings
          </div>
          <div class="page-subtitle">Manage system-wide configuration for all Inpriv services</div>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <div class="card-header">
            <span style="font-weight:600;">EU IP Blocking</span>
            <label class="toggle">
              <input type="checkbox" id="euBlockToggle" ${g.block_eu_ips ? 'checked' : ''} onchange="toggleEuBlock()">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="card-body">
            <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;line-height:1.6;">
              When enabled, all visitors from European Union member states will be blocked from accessing
              any Inpriv service. This is in response to the Chat Control 2.0 regulation which mandates
              mass surveillance of private communications — a fundamental violation of user privacy.
            </p>
            <div id="euBlockStatus" style="display:${g.block_eu_ips ? 'flex' : 'none'};align-items:center;gap:8px;padding:10px 14px;background:var(--status-bg-error);border-radius:var(--radius-sm);color:var(--status-error);font-size:13px;font-weight:500;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              EU IP blocking is active — all EU visitors are blocked
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom:20px;">
          <div class="card-header">
            <span style="font-weight:600;">Blocked Page Content</span>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Page Title</label>
              <input class="form-input" id="blockedTitle" value="${escapeHtml(g.blocked_title || 'Access Restricted')}" placeholder="Access Restricted">
            </div>
            <div class="form-group">
              <label class="form-label">Block Message</label>
              <textarea class="form-input form-textarea" id="blockedMessage" placeholder="Explain why access is blocked...">${escapeHtml(g.blocked_message || '')}</textarea>
              <div class="form-hint">This message is shown to EU visitors when they try to access any Inpriv service.</div>
            </div>
            <div class="form-toggle-row">
              <div>
                <div class="form-toggle-label">Show Privacy Stance</div>
                <div class="form-toggle-desc">Display Inpriv's stance on privacy, anonymity, and encryption</div>
              </div>
              <label class="toggle toggle-sm">
                <input type="checkbox" id="showPrivacyStance" ${g.blocked_show_privacy_stance !== false ? 'checked' : ''}>
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="btn-group">
              <button class="btn btn-primary" onclick="saveGlobalSettings()">Save Settings</button>
              <button class="btn btn-secondary" onclick="loadData()">Discard Changes</button>
            </div>
          </div>
        </div>
      `;
    }

    // ── Service Detail ─────────────────────────────────
    function renderServiceDetail(key) {
      const svc = state.services[key];
      if (!svc) {
        renderDashboard();
        return;
      }
      const main = document.getElementById('mainContent');
      const name = SERVICE_NAMES[key] || key;
      const euBlocked = state.global.block_eu_ips;
      const euOverride = svc.options?.block_eu_override || false;
      const euEffective = euBlocked && !euOverride;

      main.innerHTML = `
        <button class="back-btn" onclick="switchView('dashboard')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Dashboard
        </button>

        <div class="page-header">
          <div class="page-title">
            <span class="service-icon" style="width:40px;height:40px;display:inline-flex;">${SERVICE_ICONS[key] || ''}</span>
            ${name}
          </div>
          <div class="page-subtitle">
            ${svc.domain || 'No domain'} · Port ${svc.port || 'N/A'} · 
            <span style="color:${svc.enabled ? 'var(--status-success)' : 'var(--status-error)'}">${svc.enabled ? 'Enabled' : 'Disabled'}</span>
          </div>
        </div>

        ${euEffective ? `
        <div class="eu-banner">
          <div class="eu-banner-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <div class="eu-banner-content">
            <div class="eu-banner-title">EU IP Blocking Active</div>
            <div class="eu-banner-text">This service is affected by the global EU IP block. Visitors from the EU cannot access this service.</div>
          </div>
        </div>` : ''}

        <div class="card">
          <div class="card-header">
            <span style="font-weight:600;">Service Configuration</span>
          </div>
          <div class="card-body">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Domain</label>
                <input class="form-input form-input-mono" id="svc-domain" value="${svc.domain || ''}" placeholder="service.inpriv.xyz">
              </div>
              <div class="form-group">
                <label class="form-label">Port</label>
                <input class="form-input form-input-mono" id="svc-port" value="${svc.port || ''}" placeholder="3000" type="number">
              </div>
            </div>
            <div class="form-toggle-row">
              <div>
                <div class="form-toggle-label">Service Enabled</div>
                <div class="form-toggle-desc">Toggles whether this service is active</div>
              </div>
              <label class="toggle toggle-sm">
                <input type="checkbox" id="svc-enabled" ${svc.enabled ? 'checked' : ''}>
                <span class="toggle-slider"></span>
              </label>
            </div>

            <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:4px;">
              <h3 style="font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:12px;">Options</h3>
              ${renderServiceOptions(key, svc)}
            </div>

            <div class="btn-group">
              <button class="btn btn-primary" onclick="saveServiceConfig('${key}')">Save Changes</button>
              <button class="btn btn-secondary" onclick="loadData()">Discard</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderServiceOptions(key, svc) {
      const opts = svc.options || {};
      const euBlocked = state.global.block_eu_ips;
      let html = '';

      // EU override toggle (shown for all services)
      html += `
        <div class="form-toggle-row">
          <div>
            <div class="form-toggle-label">Bypass EU Block</div>
            <div class="form-toggle-desc">If enabled, this service will NOT block EU visitors even if the global EU block is active</div>
          </div>
          <label class="toggle toggle-sm">
            <input type="checkbox" id="opt-block_eu_override" ${opts.block_eu_override ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </div>
      `;

      // Service-specific options
      switch (key) {
        case 'mail':
          html += `
            <div class="form-group">
              <label class="form-label">Max Recipients</label>
              <input class="form-input" id="opt-max_recipients" value="${opts.max_recipients || 50}" type="number" min="1" max="500">
              <div class="form-hint">Maximum recipients per email</div>
            </div>
            <div class="form-toggle-row">
              <div>
                <div class="form-toggle-label">Allow Registration</div>
                <div class="form-toggle-desc">Allow new user registrations on the mail service</div>
              </div>
              <label class="toggle toggle-sm">
                <input type="checkbox" id="opt-allow_registration" ${opts.allow_registration !== false ? 'checked' : ''}>
                <span class="toggle-slider"></span>
              </label>
            </div>
          `;
          break;

        case 'totp':
          html += `
            <div class="form-group">
              <label class="form-label">Max Accounts Per User</label>
              <input class="form-input" id="opt-max_accounts_per_user" value="${opts.max_accounts_per_user || 50}" type="number" min="1" max="500">
            </div>
            <div class="form-group">
              <label class="form-label">Login Rate Limit</label>
              <input class="form-input form-input-mono" id="opt-rate_limit_login" value="${opts.rate_limit_login || '5/5min'}" placeholder="5/5min">
              <div class="form-hint">Format: requests/time (e.g., 5/5min, 10/1hour)</div>
            </div>
          `;
          break;

        case 'pay':
          html += `
            <div class="form-group">
              <label class="form-label">Merchant Address (Solana)</label>
              <input class="form-input form-input-mono" id="opt-merchant_address" value="${opts.merchant_address || ''}" placeholder="Your Solana wallet address">
            </div>
            <div class="form-group">
              <label class="form-label">Webhook URL</label>
              <input class="form-input form-input-mono" id="opt-webhook_url" value="${opts.webhook_url || ''}" placeholder="https://api.example.com/inpriv-hook">
              <div class="form-hint">URL to receive payment notifications</div>
            </div>
          `;
          break;

        case 'zero':
          html += `
            <div class="form-group">
              <label class="form-label">Network</label>
              <select class="form-input" id="opt-network">
                <option value="mainnet" ${opts.network === 'mainnet' ? 'selected' : ''}>Mainnet</option>
                <option value="devnet" ${opts.network === 'devnet' ? 'selected' : ''}>Devnet</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">RPC URL</label>
              <input class="form-input form-input-mono" id="opt-rpc_url" value="${opts.rpc_url || ''}" placeholder="https://api.mainnet-beta.solana.com">
            </div>
            <div class="form-group">
              <label class="form-label">Auto-Lock Timer (minutes)</label>
              <input class="form-input" id="opt-auto_lock_minutes" value="${opts.auto_lock_minutes || 5}" type="number" min="1" max="1440">
              <div class="form-hint">Minutes of inactivity before the wallet auto-locks</div>
            </div>
          `;
          break;

        case 'hush':
        case 'osint':
          html += `
            <div class="form-group">
              <label class="form-label">Default AI Model</label>
              <input class="form-input form-input-mono" id="opt-default_model" value="${opts.default_model || ''}" placeholder="openai/gpt-4o-mini">
              <div class="form-hint">OpenRouter model ID for AI-powered search</div>
            </div>
            <div class="form-group">
              <label class="form-label">SearXNG URL</label>
              <input class="form-input form-input-mono" id="opt-searxng_url" value="${opts.searxng_url || ''}" placeholder="http://localhost:8080">
              <div class="form-hint">Local or remote SearXNG instance for web search</div>
            </div>
          `;
          break;
      }

      return html;
    }

    // ── Actions ────────────────────────────────────────
    async function toggleEuBlock() {
      const checked = document.getElementById('euBlockToggle').checked;
      try {
        await apiPut('/api/global', { block_eu_ips: checked });
        state.global.block_eu_ips = checked;
        showToast(checked ? 'EU IP blocking enabled' : 'EU IP blocking disabled', 'success');
        renderDashboard();
        // Update sidebar badges
        renderSidebar();
      } catch (e) {
        showToast('Failed to update EU block setting', 'error');
      }
    }

    async function saveGlobalSettings() {
      const title = document.getElementById('blockedTitle')?.value;
      const message = document.getElementById('blockedMessage')?.value;
      const showStance = document.getElementById('showPrivacyStance')?.checked;

      try {
        await apiPut('/api/global', {
          blocked_title: title,
          blocked_message: message,
          blocked_show_privacy_stance: showStance
        });
        state.global.blocked_title = title;
        state.global.blocked_message = message;
        state.global.blocked_show_privacy_stance = showStance;
        showToast('Global settings saved', 'success');
      } catch (e) {
        showToast('Failed to save global settings', 'error');
      }
    }

    async function saveServiceConfig(key) {
      const domain = document.getElementById('svc-domain')?.value;
      const port = parseInt(document.getElementById('svc-port')?.value) || null;
      const enabled = document.getElementById('svc-enabled')?.checked;

      // Collect options
      const options = {};
      const svc = state.services[key];
      if (svc && svc.options) {
        for (const optKey of Object.keys(svc.options)) {
          const el = document.getElementById(`opt-${optKey}`);
          if (el) {
            if (el.type === 'checkbox') {
              options[optKey] = el.checked;
            } else if (el.type === 'number' || el.tagName === 'SELECT') {
              options[optKey] = el.type === 'number' ? parseInt(el.value) || 0 : el.value;
            } else {
              options[optKey] = el.value;
            }
          }
        }
      }

      try {
        await apiPut(`/api/services/${key}`, {
          domain,
          port,
          enabled,
          options
        });
        // Update local state
        if (state.services[key]) {
          state.services[key].domain = domain;
          state.services[key].port = port;
          state.services[key].enabled = enabled;
          state.services[key].options = options;
        }
        showToast(`${key} configuration saved`, 'success');
        renderSidebar();
      } catch (e) {
        showToast(`Failed to save ${key} config`, 'error');
      }
    }

    // ── Utility ────────────────────────────────────────
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Init ────────────────────────────────────────────
    loadData();
  </script>
</body>
</html>
