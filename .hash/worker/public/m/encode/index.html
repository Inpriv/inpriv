*{box-sizing:border-box;margin:0}
body{font-family:'Roboto Flex','Google Sans Text',system-ui,sans-serif;background:var(--md-surface);color:var(--md-on-surface);padding:20px 16px 32px}
.card{max-width:980px;margin:0 auto}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-1px;line-height:1.05;margin-bottom:6px}
h1 em{font-style:italic;font-weight:400;color:var(--md-primary)}
.lead{color:var(--md-on-surface-variant);font-size:14px;margin-bottom:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--md-outline-variant);border-radius:999px;overflow:hidden;background:var(--md-surface-container-low)}
.seg button{font:inherit;font-size:13.5px;padding:8px 14px;border:0;background:none;color:var(--md-on-surface-variant);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--md-primary);outline-offset:-2px}
label.f{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--md-on-surface-variant);display:block;margin:12px 0 6px}
textarea{width:100%;min-height:150px;resize:vertical;font:13.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;padding:12px 14px;border-radius:16px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container-low);color:var(--md-on-surface)}
textarea:focus{outline:2px solid var(--md-primary);outline-offset:0}
.btn{font:inherit;font-size:13.5px;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.btn.primary{background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:12.5px;min-height:1.4em;margin-top:8px;color:var(--md-on-surface-variant)}
.status.err{color:var(--md-error)}
.grow{flex:1}

<body>
<div class="card">
  <h1>Encode. <em>Decode.</em></h1>
  <p class="lead">Base64, Base64URL, URL, HTML entities and Hex — computed in your browser, nothing is sent anywhere.</p>

  <div class="row">
    <div class="seg" role="group" aria-label="Format" id="fmt">
      <button type="button" data-f="base64" aria-pressed="true">Base64</button>
      <button type="button" data-f="base64url" aria-pressed="false">Base64URL</button>
      <button type="button" data-f="url" aria-pressed="false">URL</button>
      <button type="button" data-f="html" aria-pressed="false">HTML</button>
      <button type="button" data-f="hex" aria-pressed="false">Hex</button>
    </div>
    <div class="seg" role="group" aria-label="Direction" id="dir">
      <button type="button" data-d="enc" aria-pressed="true">Encode</button>
      <button type="button" data-d="dec" aria-pressed="false">Decode</button>
    </div>
    <span class="grow"></span>
    <button type="button" class="btn" id="swap" title="Use the output as the new input">Swap ⇄</button>
  </div>

  <label class="f" for="inp">Input</label>
  <textarea id="inp" spellcheck="false" autocomplete="off" placeholder="Type or paste text…"></textarea>
  <div class="row" style="margin-top:8px">
    <button type="button" class="btn" id="pick">Load file…</button>
    <input type="file" id="file" hidden>
    <button type="button" class="btn" id="clear">Clear</button>
  </div>

  <label class="f" for="out">Output</label>
  <textarea id="out" readonly spellcheck="false"></textarea>
  <div class="row" style="margin-top:8px">
    <button type="button" class="btn primary" id="copy">Copy</button>
    <button type="button" class="btn" id="save" disabled>Download as file</button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var inp = $('inp'), out = $('out'), status = $('status');
  var st = { f: 'base64', d: 'enc', bytes: null, name: '' };   // bytes: set when a file is loaded
  var MAX_FILE = 25 * 1024 * 1024;
  var enc = new TextEncoder(), dec = new TextDecoder('utf-8', { fatal: true });

  function toB64(u8) {
    var s = '', CH = 0x8000;
    for (var i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
  }
  function fromB64(str) {
    var s = str.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(s)) throw new Error('Not valid Base64.');
    while (s.length % 4) s += '=';
    var bin = atob(s), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  function toHex(u8) { var h = []; for (var i = 0; i < u8.length; i++) h.push((u8[i] < 16 ? '0' : '') + u8[i].toString(16)); return h.join(' '); }
  function fromHex(str) {
    var s = str.replace(/0x/gi, '').replace(/[\s,:-]+/g, '');
    if (!/^[0-9a-fA-F]*$/.test(s) || s.length % 2) throw new Error('Not valid hex (need an even number of hex digits).');
    var u8 = new Uint8Array(s.length / 2);
    for (var i = 0; i < u8.length; i++) u8[i] = parseInt(s.substr(i * 2, 2), 16);
    return u8;
  }
  function htmlEnc(s) {
    return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; })
      .replace(/[^\x00-\x7e]/gu, function (c) { return '&#' + c.codePointAt(0) + ';'; });
  }
  function htmlDec(s) { var t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

  // result: { text?: string, bytes?: Uint8Array }
  function run() {
    status.className = 'status'; status.textContent = '';
    $('save').disabled = true;
    var f = st.f, d = st.d, res;
    try {
      if (d === 'enc') {
        var u8 = st.bytes || enc.encode(inp.value);
        if (f === 'base64') res = { text: toB64(u8) };
        else if (f === 'base64url') res = { text: toB64(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
        else if (f === 'hex') res = { text: toHex(u8) };
        else {
          var s = st.bytes ? dec.decode(st.bytes) : inp.value;
          res = { text: f === 'url' ? encodeURIComponent(s) : htmlEnc(s) };
        }
      } else {
        var v = inp.value;
        if (f === 'base64' || f === 'base64url' || f === 'hex') {
          var b = f === 'hex' ? fromHex(v) : fromB64(v);
          try { res = { text: dec.decode(b), bytes: b }; }
          catch (e) { res = { text: '', bytes: b, binary: true }; }
        } else if (f === 'url') res = { text: decodeURIComponent(v.replace(/\+/g, ' ')) };
        else res = { text: htmlDec(v) };
      }
    } catch (e) {
      out.value = ''; status.className = 'status err';
      status.textContent = e instanceof URIError ? 'Malformed URL escape sequence.' : (e.message || 'Could not convert.');
      return;
    }
    out.value = res.binary ? '(binary data — use “Download as file”)' : res.text;
    out.dataset.bin = res.bytes ? '1' : '';
    st.outBytes = res.bytes || null;
    $('save').disabled = !(res.bytes || d === 'enc');
    status.textContent = res.binary ? res.bytes.length + ' bytes of binary data.' : (res.text.length + ' characters');
  }

  Array.prototype.forEach.call(document.querySelectorAll('#fmt button'), function (b) {
    b.addEventListener('click', function () {
      st.f = b.dataset.f;
      Array.prototype.forEach.call(document.querySelectorAll('#fmt button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      run();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#dir button'), function (b) {
    b.addEventListener('click', function () {
      st.d = b.dataset.d;
      Array.prototype.forEach.call(document.querySelectorAll('#dir button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      run();
    });
  });
  inp.addEventListener('input', function () { st.bytes = null; st.name = ''; run(); });
  $('clear').addEventListener('click', function () { inp.value = ''; st.bytes = null; st.name = ''; run(); inp.focus(); });
  $('swap').addEventListener('click', function () {
    if (!out.value || out.value.indexOf('(binary') === 0) return;
    inp.value = out.value; st.bytes = null;
    st.d = st.d === 'enc' ? 'dec' : 'enc';
    Array.prototype.forEach.call(document.querySelectorAll('#dir button'), function (x) { x.setAttribute('aria-pressed', String(x.dataset.d === st.d)); });
    run();
  });
  $('copy').addEventListener('click', function () {
    if (!out.value) return;
    (navigator.clipboard ? navigator.clipboard.writeText(out.value) : Promise.reject()).then(function () {
      status.className = 'status'; status.textContent = 'Copied.';
    }, function () { out.select(); document.execCommand('copy'); status.textContent = 'Copied.'; });
  });
  $('save').addEventListener('click', function () {
    var bytes = st.outBytes || enc.encode(out.value);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
    var a = document.createElement('a'); a.href = url; a.download = st.d === 'dec' ? 'decoded.bin' : 'encoded.txt';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });
  $('pick').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = $('file').files[0]; $('file').value = '';
    if (!f) return;
    if (f.size > MAX_FILE) { status.className = 'status err'; status.textContent = 'File too large (limit 25 MB).'; return; }
    f.arrayBuffer().then(function (buf) {
      st.bytes = new Uint8Array(buf); st.name = f.name;
      st.d = 'enc'; Array.prototype.forEach.call(document.querySelectorAll('#dir button'), function (x) { x.setAttribute('aria-pressed', String(x.dataset.d === 'enc')); });
      inp.value = '[file] ' + f.name + ' (' + f.size + ' bytes)';
      run();
    });
  });
  run();
})();
</script>
<script data-embed>
(function(){
  if(window.parent===window)return;
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin)return;var d=e.data||{};
    if(d.type==='inpriv-theme'){document.documentElement.setAttribute('data-theme',d.theme);try{localStorage.setItem('inpriv_theme',d.theme);localStorage.setItem('inpriv-theme',d.theme);}catch(x){}}
  });
  window.addEventListener('load',function(){parent.postMessage({type:'inpriv-ready',mode:'encode'},location.origin)});
})();
</script>
<script>try{var t=localStorage.getItem('inpriv_theme')||localStorage.getItem('inpriv-theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
</body>
