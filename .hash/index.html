*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Roboto Flex','Google Sans Text',system-ui,sans-serif;background:var(--md-surface);color:var(--md-on-surface);display:flex;flex-direction:column;min-height:100dvh}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1320px;width:100%;margin-inline:auto;padding:16px 16px 0}
@media(min-width:600px){.bar{padding:22px 24px 0}}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-title{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.brand-title .accent{color:var(--md-primary)}
.brand-tagline{font-size:12px;color:var(--md-on-surface-variant);font-weight:500;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
@media(max-width:599px){.brand-title{font-size:20px}.brand-tagline{display:none}}
.actions{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--md-secondary-container);color:var(--md-on-secondary-container);font-size:12.5px;font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);color:var(--md-on-surface);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--md-surface-container-high)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .icon-sun{display:none}[data-theme="light"] .icon-moon{display:none}

.wrap{max-width:1320px;width:100%;margin-inline:auto;padding:14px 16px 0;display:flex;flex-direction:column;flex:1;min-height:0}
@media(min-width:600px){.wrap{padding:16px 24px 0}}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 18px;border-radius:14px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container-low);color:var(--md-on-surface-variant);cursor:pointer;font:inherit;text-align:left}
.tab b{font-size:15px;font-weight:600;color:var(--md-on-surface)}
.tab small{font-size:11.5px}
.tab:hover{background:var(--md-surface-container)}
.tab[aria-selected="true"]{background:var(--md-primary-container);border-color:transparent}
.tab[aria-selected="true"] b,.tab[aria-selected="true"] small{color:var(--md-on-primary-container)}
.tab:focus-visible{outline:2px solid var(--md-primary);outline-offset:2px}
.hint{flex:none;margin-top:10px;font-size:12.5px;color:var(--md-on-surface-variant);min-height:1.3em}

.stage{flex:1;margin-top:12px;min-height:70dvh;border-radius:20px 20px 0 0;overflow:hidden;background:var(--md-surface);border:1px solid var(--md-outline-variant);border-bottom:0;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:none}
.stage iframe.active{display:block}
.foot{text-align:center;font-size:11.5px;color:var(--md-on-surface-variant);padding:8px 16px;border-top:1px solid var(--md-outline-variant)}
.foot a{color:inherit}

<body>
<header class="bar">
  <div class="brand"><div class="brand-title">hash<span class="accent">.</span></div><div class="brand-tagline">Inpriv Labs</div></div>
  <div class="actions">
    <div class="pill"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>100% Local</div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle color theme" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="Inpriv Hash tools">
    <button class="tab" role="tab" data-mode="hash" aria-selected="false"><b>Hash</b><small>Checksums for files and text</small></button>
    <button class="tab" role="tab" data-mode="brute" aria-selected="false"><b>Brute</b><small>Reverse a hash (MD5 · SHA-1/256/384/512)</small></button>
    <button class="tab" role="tab" data-mode="encode" aria-selected="false"><b>Encode</b><small>Base64 · URL · HTML · Hex</small></button>
  </div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="stage" id="stage"></div>
</main>
<div class="foot">Everything runs in your browser · no trackers · <a href="https://inpriv.xyz/">inpriv.xyz</a></div>

<script>
(function () {
  var MODES = ["hash", "brute", "encode"];
  var HINTS = {"hash": "Compute MD5 / SHA checksums of text or files, locally.", "brute": "Test a hash against wordlists and patterns in your browser.", "encode": "Encode or decode text and files. Nothing leaves this page."};
  var TITLE = 'Inpriv Hash';
  var stage = document.getElementById('stage');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var hint = document.getElementById('hint');
  var frames = {}, ready = {};

  function post(mode, msg) {
    var f = frames[mode];
    if (f && ready[mode] && f.contentWindow) f.contentWindow.postMessage(msg, location.origin);
  }
  function theme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('inpriv_theme', t); localStorage.setItem('inpriv-theme', t); } catch (e) {}
    MODES.forEach(function (m) { post(m, { type: 'inpriv-theme', theme: t }); });
  }
  var saved = null;
  try { saved = localStorage.getItem('inpriv_theme') || localStorage.getItem('inpriv-theme'); } catch (e) {}
  if (!saved) saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').addEventListener('click', function () {
    theme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  function ensureFrame(mode) {
    if (frames[mode]) return;
    var f = document.createElement('iframe');
    f.title = mode;
    f.src = '/m/' + mode + '/?embed=1';
    stage.appendChild(f);
    frames[mode] = f;
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'inpriv-ready') return;
    ready[e.data.mode] = true;
    post(e.data.mode, { type: 'inpriv-theme', theme: document.documentElement.getAttribute('data-theme') });
  });

  function show(mode, push) {
    if (MODES.indexOf(mode) < 0) mode = MODES[0];
    ensureFrame(mode);
    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.mode === mode)); });
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('active', k === mode); });
    hint.textContent = HINTS[mode] || '';
    var label = tabs.filter(function (t) { return t.dataset.mode === mode; })[0].querySelector('b').textContent;
    document.title = TITLE + ' — ' + label;
    if (push !== false && location.hash !== '#' + mode) history.replaceState(null, '', '#' + mode);
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.mode); }); });

  function fromLocation() {
    var m = (location.hash || '').replace('#', '') || new URLSearchParams(location.search).get('mode');
    return MODES.indexOf(m) >= 0 ? m : MODES[0];
  }
  window.addEventListener('hashchange', function () { show(fromLocation(), false); });
  show(fromLocation(), false);

  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
})();
</script>
