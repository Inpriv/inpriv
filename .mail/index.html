<style>
/* ============================================================================
   AUREX LABS DESIGN SYSTEM — M3 Earthy Forest
   ========================================================================== */
:root {
  --md-primary: #ABD37A;
  --md-on-primary: #173800;
  --md-primary-container: #2E4F2F;
  --md-on-primary-container: #C7EFA0;
  --md-secondary: #BCCBAF;
  --md-on-secondary: #27341F;
  --md-secondary-container: #3D4B34;
  --md-on-secondary-container: #D8E7CB;
  --md-tertiary: #FFB4A5;
  --md-on-tertiary: #5E1709;
  --md-tertiary-container: #7E2D1E;
  --md-on-tertiary-container: #FFDAD3;
  --md-error: #FFB4AB;
  --md-on-error: #690005;
  --md-error-container: #93000A;
  --md-on-error-container: #FFDAD6;
  --md-surface: #13140E;
  --md-on-surface: #E3E2D3;
  --md-on-surface-variant: #C3C8B6;
  --md-surface-dim: #0D0F09;
  --md-surface-container-lowest: #0D0F09;
  --md-surface-container-low: #1A1C17;
  --md-surface-container: #1F211B;
  --md-surface-container-high: #292B25;
  --md-surface-container-highest: #34362F;
  --md-outline: #8D9283;
  --md-outline-variant: #43483D;
  --md-inverse-surface: #E3E2D3;
  --md-inverse-on-surface: #2F312C;
  --md-inverse-primary: #466E47;
  --md-shadow-color: rgba(0, 0, 0, 0.45);
  --md-shadow-color-strong: rgba(0, 0, 0, 0.7);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

:root[data-theme="light"] {
  --md-primary: #466E47;
  --md-on-primary: #FFFFFF;
  --md-primary-container: #C7EFA0;
  --md-on-primary-container: #0C2000;
  --md-secondary: #55624C;
  --md-on-secondary: #FFFFFF;
  --md-secondary-container: #D8E7CB;
  --md-on-secondary-container: #131F0C;
  --md-tertiary: #9C4231;
  --md-on-tertiary: #FFFFFF;
  --md-tertiary-container: #FFDAD3;
  --md-on-tertiary-container: #3D0A03;
  --md-error: #BA1A1A;
  --md-on-error: #FFFFFF;
  --md-error-container: #FFDAD6;
  --md-on-error-container: #410002;
  --md-surface: #FAF9F0;
  --md-on-surface: #1A1C17;
  --md-on-surface-variant: #43483D;
  --md-surface-dim: #DBDAD0;
  --md-surface-container-lowest: #FFFFFF;
  --md-surface-container-low: #F4F3E7;
  --md-surface-container: #EEEDDE;
  --md-surface-container-high: #E9E7D9;
  --md-surface-container-highest: #E3E2D3;
  --md-outline: #74796C;
  --md-outline-variant: #C3C8B6;
  --md-inverse-surface: #2F312C;
  --md-inverse-on-surface: #F0EFE7;
  --md-inverse-primary: #ABD37A;
  --md-shadow-color: rgba(20, 25, 15, 0.12);
  --md-shadow-color-strong: rgba(20, 25, 15, 0.25);
}

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Roboto Flex', system-ui, -apple-system, sans-serif;
  font-optical-sizing: auto;
  font-size: 15px;
  line-height: 1.5;
  color: var(--md-on-surface);
  background: var(--md-surface);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}

/* ---------- Background Atmosphere ---------- */
.bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bg-ambient {
  background:
    radial-gradient(ellipse 90% 60% at 85% 0%, color-mix(in srgb, var(--md-primary-container) 45%, transparent) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 0% 100%, color-mix(in srgb, var(--md-tertiary-container) 35%, transparent) 0%, transparent 70%),
    var(--md-surface);
  background-attachment: fixed;
}
.bg-dots {
  background-image: radial-gradient(circle at 1px 1px, var(--md-outline-variant) 1px, transparent 0);
  background-size: 28px 28px;
  opacity: 0.18;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}

/* ---------- App Layout ---------- */
#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- Top App Bar ---------- */
.app-bar {
  position: fixed;
  top: max(10px, var(--safe-top));
  left: 12px;
  right: 12px;
  height: 52px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px 0 14px;
  background: color-mix(in srgb, var(--md-surface-container) 85%, transparent);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid color-mix(in srgb, var(--md-outline-variant) 50%, transparent);
  border-radius: 9999px;
  box-shadow: 0 4px 20px -4px var(--md-shadow-color);
  animation: barIn 0.5s cubic-bezier(0.2, 1.4, 0, 1) both;
}
@keyframes barIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: inherit;
}
.brand-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  flex-shrink: 0;
}
.brand-icon .ms { font-size: 18px; }
.brand-title {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--md-on-surface);
  display: flex;
  align-items: center;
  gap: 6px;
}
.badge-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
}

.app-bar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ---------- Icon Buttons ---------- */
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--md-on-surface-variant);
  cursor: pointer;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: background 0.2s cubic-bezier(0.2, 1.4, 0, 1), transform 0.15s;
}
.icon-btn:hover { background: color-mix(in srgb, var(--md-on-surface) 10%, transparent); color: var(--md-on-surface); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn .ms { font-size: 20px; }

/* ---------- Main Container ---------- */
.main-content {
  flex: 1;
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: calc(68px + var(--safe-top)) 14px calc(90px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

@media(min-width: 768px) {
  .app-bar {
    top: 16px;
    left: max(20px, calc(50vw - 480px));
    right: max(20px, calc(50vw - 480px));
    height: 56px;
  }
  .main-content {
    padding: 92px 20px 100px;
    gap: 20px;
  }
}

/* Suppress duplicate fixed widgets injected by id.js to prevent covering app bar / theme toggle / header actions */
#inpriv-id-chip, .inpriv-id-chip, #inpriv-id-prompt, .inpriv-id-prompt, #inpriv-id-card, .inpriv-id-card {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* ---------- Inpriv ID Header Pill ---------- */
.id-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 10px 0 8px;
  border-radius: 9999px;
  background: var(--md-surface-container-high);
  border: 1px solid var(--md-outline-variant);
  color: var(--md-on-surface);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s cubic-bezier(0.2, 1.4, 0, 1);
  max-width: 120px;
  flex-shrink: 1;
}
@media(min-width: 480px) { .id-status-pill { max-width: 200px; } }
@media(max-width: 380px) {
  .id-status-pill { max-width: 90px; }
}
.id-status-pill:hover { border-color: var(--md-primary); transform: translateY(-1px); }
.id-status-pill .id-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--md-primary);
  flex-shrink: 0;
}
.id-status-pill .id-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- Material Symbols ---------- */
.ms, .icon, .material-symbols-rounded {
  font-family: 'Material Symbols Rounded', sans-serif;
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
  font-variation-settings: 'wght' 500, 'GRAD' 0, 'opsz' 24;
}

/* ---------- Cards & Containers ---------- */
.card {
  background: var(--md-surface-container-low);
  border: 1px solid var(--md-outline-variant);
  border-radius: 24px;
  padding: 18px;
  box-shadow: 0 4px 24px -8px var(--md-shadow-color);
  animation: fadeUp 0.4s cubic-bezier(0.2, 1.4, 0, 1) both;
}
@media(min-width: 600px) {
  .card { border-radius: 28px; padding: 24px; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 48px;
  min-height: 48px;
  padding: 0 20px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  border-radius: 9999px;
  transition: all 0.2s cubic-bezier(0.2, 1.4, 0, 1);
  text-decoration: none;
}
.btn .ms { font-size: 20px; }
.btn-primary {
  background: var(--md-primary);
  color: var(--md-on-primary);
  box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--md-primary) 50%, transparent);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px -4px color-mix(in srgb, var(--md-primary) 65%, transparent);
}
.btn-primary:active { transform: scale(0.97); }

.btn-tonal {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
}
.btn-tonal:hover { transform: translateY(-1px); }
.btn-tonal:active { transform: scale(0.97); }

.btn-outlined {
  background: transparent;
  color: var(--md-on-surface);
  border: 1px solid var(--md-outline);
}
.btn-outlined:hover { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); }

.btn-text {
  background: transparent;
  color: var(--md-primary);
  padding: 0 14px;
  height: 40px;
  min-height: 40px;
}
.btn-text:hover { background: color-mix(in srgb, var(--md-primary) 10%, transparent); }

.btn-danger {
  background: var(--md-error);
  color: var(--md-on-error);
}

.btn-block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

/* ---------- Form Inputs ---------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}
.field label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--md-on-surface-variant);
}
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.field input, .field textarea {
  font-family: inherit;
  font-size: 15px;
  color: var(--md-on-surface);
  background: var(--md-surface-container);
  border: 1px solid var(--md-outline-variant);
  border-radius: 16px;
  padding: 13px 14px;
  outline: none;
  width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  -webkit-appearance: none;
}
.field input:focus, .field textarea:focus {
  border-color: var(--md-primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 18%, transparent);
}
.input-suffix {
  position: absolute;
  right: 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--md-primary);
  pointer-events: none;
  background: var(--md-surface-container-high);
  padding: 3px 8px;
  border-radius: 8px;
}
.eye-toggle {
  position: absolute;
  right: 10px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--md-on-surface-variant);
  border: none;
  background: transparent;
}
.eye-toggle:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
.eye-toggle .ms { font-size: 20px; }

/* ---------- Auth Screens ---------- */
.auth-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 160px);
  min-height: calc(100dvh - 160px);
  padding: 10px 0;
}
.auth-box {
  width: 100%;
  max-width: 440px;
  background: var(--md-surface-container-low);
  border: 1px solid var(--md-outline-variant);
  border-radius: 28px;
  padding: 24px 20px;
  box-shadow: 0 12px 40px -10px var(--md-shadow-color-strong);
}
@media(min-width: 480px) {
  .auth-box { padding: 32px 28px; }
}

.auth-header {
  text-align: center;
  margin-bottom: 20px;
}
.auth-header-icon {
  width: 52px;
  height: 52px;
  border-radius: 18px;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  display: grid;
  place-items: center;
  margin: 0 auto 14px;
}
.auth-header-icon .ms { font-size: 28px; }
.auth-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--md-on-surface);
  margin-bottom: 6px;
}
.auth-subtitle {
  font-size: 13.5px;
  color: var(--md-on-surface-variant);
  line-height: 1.45;
}

.auth-segmented {
  display: flex;
  background: var(--md-surface-container-high);
  border-radius: 9999px;
  padding: 4px;
  margin-bottom: 20px;
}
.auth-segmented button {
  flex: 1;
  height: 38px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--md-on-surface-variant);
  border-radius: 9999px;
  transition: all 0.25s cubic-bezier(0.2, 1.4, 0, 1);
}
.auth-segmented button.active {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
}

.sso-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--md-surface-container);
  border: 1px solid var(--md-primary);
  border-radius: 20px;
  padding: 12px 16px;
  margin-bottom: 18px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.2, 1.4, 0, 1);
  text-align: left;
  user-select: none;
}
.sso-card:hover {
  background: var(--md-surface-container-high);
  border-color: var(--md-primary);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px -6px var(--md-shadow-color);
}
.sso-card:active {
  transform: scale(0.99);
}
.sso-av {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 15px;
  flex-shrink: 0;
}
.sso-meta { flex: 1; min-width: 0; }
.sso-nick { font-size: 14px; font-weight: 700; color: var(--md-on-surface); }
.sso-email { font-size: 12px; color: var(--md-primary); word-break: break-all; margin-top: 2px; }
.sso-action-icon {
  color: var(--md-outline);
  transition: color 0.2s, transform 0.2s;
  flex-shrink: 0;
}
.sso-card:hover .sso-action-icon {
  color: var(--md-primary);
  transform: translateX(3px);
}

.pulse-focus {
  animation: pulseGlow 0.8s cubic-bezier(0.2, 1.4, 0, 1);
}
@keyframes pulseGlow {
  0% { box-shadow: 0 0 0 0 var(--md-primary); }
  50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--md-primary) 50%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ---------- Security Badge ---------- */
.sec-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--md-primary-container) 40%, transparent);
  border: 1px solid color-mix(in srgb, var(--md-primary) 30%, transparent);
  font-size: 12px;
  font-weight: 500;
  color: var(--md-on-primary-container);
  margin-bottom: 14px;
}
.sec-badge .ms { font-size: 18px; color: var(--md-primary); flex-shrink: 0; }

/* ---------- Dashboard Controls & Search ---------- */
.dash-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--md-surface-container);
  border: 1px solid var(--md-outline-variant);
  border-radius: 9999px;
  padding: 0 14px;
  height: 44px;
  transition: border-color 0.2s;
}
.search-bar:focus-within {
  border-color: var(--md-primary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--md-primary) 20%, transparent);
}
.search-bar .ms { font-size: 20px; color: var(--md-on-surface-variant); }
.search-bar input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 14px;
  color: var(--md-on-surface);
}

.filter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.tab-seg {
  display: inline-flex;
  background: var(--md-surface-container-high);
  border-radius: 9999px;
  padding: 3px;
}
.tab-seg button {
  height: 36px;
  padding: 0 14px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--md-on-surface-variant);
  border-radius: 9999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s cubic-bezier(0.2, 1.4, 0, 1);
}
.tab-seg button.active {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
}
.tab-seg button .ms { font-size: 17px; }
.tab-seg .pill-num {
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 9999px;
  background: color-mix(in srgb, var(--md-on-surface) 12%, transparent);
}

/* ---------- Message List ---------- */
.msg-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px;
  background: var(--md-surface-container-low);
  border: 1px solid var(--md-outline-variant);
  border-radius: 20px;
  cursor: pointer;

<script>
(() => {
'use strict';

const API = '/api/v1';
const DOMAIN = 'inpriv.xyz';
const PASS_ITERS = 300000;
const PBKDF2_CAP = 100000;

/* ---------- State ---------- */
const state = {
  token: localStorage.getItem('inpriv_token'),
  user: null,
  privKey: null,         // RSA-OAEP CryptoKey unlocked in memory
  pubKey: null,          // RSA-OAEP CryptoKey
  messages: [],
  activeTab: 'inbox',    // 'inbox' | 'sent' | 'account'
  searchQuery: '',
  idUser: null,          // Inpriv ID user object (if detected)
  unlocked: false,
  ssoTried: false,       // auto Quick Sign-In attempted this page load
  ssoBusy: false,
  dek: null,             // mailbox DEK kept in memory (Quick Unlock re-enrolment)
};

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const b64 = {
  enc(buf) {
    const b = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  },
  dec(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }
};

const utf8 = {
  enc(s) { return new TextEncoder().encode(s); },
  dec(b) { return new TextDecoder().decode(b); }
};

function mkIcon(name, cls = '') {
  return `<span class="ms ${cls}">${name}</span>`;
}

function toast(title, desc = '', type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${type === 'error' ? 'error' : ''}`;
  el.innerHTML = `
    ${mkIcon(type === 'error' ? 'error' : 'check_circle')}
    <div>
      <div class="toast-title">${escapeHtml(title)}</div>
      ${desc ? `<div class="toast-desc">${escapeHtml(desc)}</div>` : ''}
    </div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(12px)';
    setTimeout(() => el.remove(), 320);
  }, 3600);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function initials(name) {
  if (!name) return '?';
  const clean = name.replace(/<[^>]+>/g, '').trim();
  const parts = clean.split(/[\s@._-]+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  const sameYear = d.getFullYear() === now.getFullYear();
  return d.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: '2-digit' });
}

/* ---------- Confirm Dialog (in-app; native confirm() is blocked in in-app browsers) ---------- */
function confirmDialog({ title, desc = '', confirmLabel = 'Delete', danger = true }) {
  return new Promise((resolve) => {
    const container = $('#modalContainer');
    if (!container) { resolve(false); return; }

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-sheet" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 class="modal-title">${escapeHtml(title)}</h2>
        </div>
        ${desc ? `<div class="confirm-desc">${escapeHtml(desc)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn btn-outlined" id="cfCancelBtn" type="button">Cancel</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cfOkBtn" type="button">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>
    `;
    container.appendChild(overlay);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => overlay.classList.add('open'));
    });

    const done = (result) => {
      overlay.classList.remove('open');
      setTimeout(() => overlay.remove(), 320);
      resolve(result);
    };
    $('#cfOkBtn', overlay).addEventListener('click', () => done(true));
    $('#cfCancelBtn', overlay).addEventListener('click', () => done(false));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) done(false);
    });
  });
}

/* ---------- API Call Helper ---------- */
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  const res = await fetch(API + path, { ...opts, headers });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const msg = (data && (data.detail?.message || data.error || (typeof data.detail === 'string' ? data.detail : null))) || `HTTP ${res.status}`;
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* ============================================================================
   WEB CRYPTO — Zero-Knowledge Hybrid Encryption (RSA-2048 + AES-GCM)
   ========================================================================== */
async function generateKeyPair() {
  return crypto.subtle.generateKey(
    { name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256' },
    true,
    ['encrypt', 'decrypt']
  );
}

async function deriveAesFromPassword(password, saltB64, iterations = PASS_ITERS) {
  const rounds = Math.max(1, Math.ceil(iterations / PBKDF2_CAP));
  let material = utf8.enc(password);
  let bits;
  for (let r = 0; r < rounds; r++) {
    const key = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveBits']);
    bits = await crypto.subtle.deriveBits(
      {
        name: 'PBKDF2',
        salt: new Uint8Array(b64.dec(saltB64)),
        iterations: Math.min(iterations - r * PBKDF2_CAP, PBKDF2_CAP),
        hash: 'SHA-256'
      },
      key,
      256
    );
    material = new Uint8Array(bits);
    }
    // extractable: true is REQUIRED — the Quick Unlock enrolment wraps
    // (exports) this key under the device key. The key lives only in
    // memory and is wiped on sign-out, same as the RSA private key.
    return crypto.subtle.importKey('raw', bits, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

async function exportPublicKey(pubKey) {
  const spki = await crypto.subtle.exportKey('spki', pubKey);
  return b64.enc(spki);
}

async function wrapPrivateKey(privKey, aesKey) {
  const pkcs8 = await crypto.subtle.exportKey('pkcs8', privKey);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, pkcs8);
  return { wrapped: b64.enc(ct), iv: b64.enc(iv.buffer) };
}

/* ---------- Quick Unlock device key (opt-in master-password bypass) ----
   Random AES key in localStorage; the mailbox DEK (the PBKDF2 password
   key) is wrapped under it and stored server-side as ciphertext. Server
   never sees either key in the clear. */
const DEVICE_KEY_NAME = 'inpriv_device_key';
const DEVICE_PUB_NAME = 'inpriv_device_pub';
let _deviceKeyCache = null;
async function getDeviceKey(create) {
  if (_deviceKeyCache) return _deviceKeyCache;
  const raw = localStorage.getItem(DEVICE_KEY_NAME);
  if (raw) {
    try {
      _deviceKeyCache = await crypto.subtle.importKey('raw', b64.dec(raw), { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      return _deviceKeyCache;
    } catch (e) { localStorage.removeItem(DEVICE_KEY_NAME); localStorage.removeItem(DEVICE_PUB_NAME); }
  }
  if (!create) return null;
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const ex = await crypto.subtle.exportKey('raw', key);
  localStorage.setItem(DEVICE_KEY_NAME, b64.enc(ex));
  _deviceKeyCache = key;
  return key;
}
function clearDeviceKey() {
  localStorage.removeItem(DEVICE_KEY_NAME);
  localStorage.removeItem(DEVICE_PUB_NAME);
  _deviceKeyCache = null;
}
async function wrapRawDek(dekKey, deviceKey) {
  const raw = await crypto.subtle.exportKey('raw', dekKey);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, deviceKey, raw);
  return b64.enc(iv) + '.' + b64.enc(ct);
}
async function unwrapRawDek(blob, deviceKey) {
  const [ivB, ctB] = String(blob).split('.');
  if (!ivB || !ctB) return null;
  try {
    const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(b64.dec(ivB)) }, deviceKey, b64.dec(ctB));
    // extractable so the Account-settings toggle can re-wrap this DEK
    return await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  } catch (e) { return null; }
}

/* Enrol this device for Quick Unlock: wrap the mailbox DEK under the local
   device key and store the ciphertext server-side. Called after EVERY
   password unlock (login, session unlock, init, registration) so a missing
   or stale wrap never makes the user type the master password twice.
   Honours the Inpriv ID account setting (widget flag, else /me fallback). */
async function enrolQuickUnlock(dek) {
  if (!dek) return false;
  let qu = state.idUser
    ? state.idUser.quick_unlock
    : (state.user && typeof state.user.quick_unlock !== 'undefined') ? state.user.quick_unlock : undefined;
  if (qu === undefined) {
    try { qu = (await api('/me', { method: 'GET' })).quick_unlock !== false; } catch (e) {}
  }
  if (!qu) return false;
  const dk = await getDeviceKey(true);
  const wrapped = await wrapRawDek(dek, dk);
  await api('/device-key/set', { method: 'POST', body: JSON.stringify({ wrapped_dek: wrapped }) });
  return true;
}

async function unwrapPrivateKey(wrappedB64, ivB64, aesKey) {
  const pkcs8 = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: new Uint8Array(b64.dec(ivB64)) },
    aesKey,
    b64.dec(wrappedB64)
  );
  return crypto.subtle.importKey('pkcs8', pkcs8, { name: 'RSA-OAEP', hash: 'SHA-256' }, true, ['decrypt']);
}

// Client-side Hybrid Encryption for Sender & Recipient
async function hybridEncryptDual(recipientPubKey, senderPubKey, plaintextStr) {
  const aesKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, utf8.enc(plaintextStr));
  const ctBytes = new Uint8Array(ctBuf);
  const ciphertext = ctBytes.slice(0, ctBytes.length - 16);
  const tag = ctBytes.slice(ctBytes.length - 16);

  const rawAes = await crypto.subtle.exportKey('raw', aesKey);
  const recipientWrapped = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, recipientPubKey, rawAes);
  const senderWrapped = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, senderPubKey, rawAes);

  return {
    recipient_envelope: {
      encrypted_aes_key: b64.enc(recipientWrapped),
      iv: b64.enc(iv.buffer),
      ciphertext: b64.enc(ciphertext.buffer),
      auth_tag: b64.enc(tag.buffer)
    },
    sender_envelope: {
      encrypted_aes_key: b64.enc(senderWrapped),
      iv: b64.enc(iv.buffer),
      ciphertext: b64.enc(ciphertext.buffer),
      auth_tag: b64.enc(tag.buffer)
    }
  };
}

// Client-side Hybrid Encryption for Sender copy (External email)
async function hybridEncryptSingle(pubKey, plaintextStr) {
  const aesKey = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, utf8.enc(plaintextStr));
  const ctBytes = new Uint8Array(ctBuf);
  const ciphertext = ctBytes.slice(0, ctBytes.length - 16);
  const tag = ctBytes.slice(ctBytes.length - 16);
  const rawAes = await crypto.subtle.exportKey('raw', aesKey);
  const wrapped = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pubKey, rawAes);
  return {
    encrypted_aes_key: b64.enc(wrapped),
    iv: b64.enc(iv.buffer),
    ciphertext: b64.enc(ciphertext.buffer),
    auth_tag: b64.enc(tag.buffer)
  };
}

async function hybridDecrypt(privKey, enc) {
  const rawAes = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, privKey, b64.dec(enc.encrypted_aes_key));
  const aesKey = await crypto.subtle.importKey('raw', rawAes, { name: 'AES-GCM' }, false, ['decrypt']);
  const ct = new Uint8Array(b64.dec(enc.ciphertext));
  const tag = new Uint8Array(b64.dec(enc.auth_tag));
  const merged = new Uint8Array(ct.length + tag.length);
  merged.set(ct, 0);
  merged.set(tag, ct.length);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(b64.dec(enc.iv)) }, aesKey, merged.buffer);
  return utf8.dec(pt);
}

    const email = state.idUser.email || (state.idUser.username + '@inpriv.xyz');
    banner.innerHTML = `

    if (ssoCard) {

/* ---------- Login Flow ---------- */
async function handleLogin(username, password) {
  const btn = $('#authSubmitBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> <span>Unlocking…</span>`; }

  try {
    const res = await api('/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });

    if (res.status === 'needs_init') {
      // Inpriv ID user needs key generation
      toast('Inpriv ID verified', 'Generating zero-knowledge encryption keys…');
      await initializeInprivIdKeys(res.username, password);
      return;
    }

    state.token = res.token;
    state.user = res.user;
    localStorage.setItem('inpriv_token', res.token);

    // Derive AES key & unwrap private RSA key
    const aesKey = await deriveAesFromPassword(password, res.user.priv_salt, res.user.priv_iter);
    state.dek = aesKey; // kept for Quick Unlock re-enrolment from settings
    state.privKey = await unwrapPrivateKey(res.user.encrypted_private_key, res.user.priv_iv, aesKey);
    state.pubKey = await crypto.subtle.importKey('spki', b64.dec(res.user.public_key), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
    state.unlocked = true;

    // Quick Unlock enrolment: wrap the freshly derived DEK under this
    // device's key so future visits skip the master password (the account
    // setting is checked inside the helper).
    try { await enrolQuickUnlock(aesKey); } catch (e) { /* best-effort; password login still works */ }
    toast('Mailbox unlocked', `Signed in as ${res.user.email}`);
    renderDashboard();
  } catch (e) {
    toast('Login failed', e.message, 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = `<span>Unlock Mailbox</span> ${mkIcon('lock_open')}`; }
  }
}

/* ---------- Initialize Inpriv ID User Keys ---------- */
async function initializeInprivIdKeys(username, password) {
  try {
    const kp = await generateKeyPair();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const saltB64 = b64.enc(salt.buffer);
    const aesKey = await deriveAesFromPassword(password, saltB64, PASS_ITERS);
    const pubB64 = await exportPublicKey(kp.publicKey);
    const { wrapped, iv } = await wrapPrivateKey(kp.privateKey, aesKey);
    state.dek = aesKey; // kept for Quick Unlock re-enrolment from settings

    const res = await api('/init-keys', {
      method: 'POST',
      body: JSON.stringify({
        username,
        password,
        public_key: pubB64,
        encrypted_private_key: wrapped,
        priv_iv: iv,
        priv_salt: saltB64,
        priv_iter: PASS_ITERS
      })
    });

    state.token = res.token;
    state.user = res.user;
    state.privKey = kp.privateKey;
    state.pubKey = kp.publicKey;
    state.unlocked = true;
    localStorage.setItem('inpriv_token', res.token);

    // enrol Quick Unlock right away — the DEK is fresh in memory here.
    try { await enrolQuickUnlock(aesKey); } catch (e) {}
    toast('Mailbox initialized', `Your zero-knowledge keys are active for ${res.user.email}`);
    renderDashboard();
  } catch (e) {
    toast('Key setup failed', e.message, 'error');
    renderAuth('login');
  }
}

/* ---------- Registration Flow ---------- */
async function handleRegister(username, password, confirm) {
  if (password !== confirm) {
    toast('Passwords mismatch', 'Please re-type password identically.', 'error');
    return;
  }
  if (password.length < 10) {
    toast('Password too short', 'Use at least 10 characters.', 'error');
    return;
  }

  const btn = $('#regSubmitBtn');
  const status = $('#regStatus');
  if (btn) btn.disabled = true;

  try {
    if (status) status.innerHTML = `<span class="spinner"></span> Generating RSA-2048 keypair…`;
    const kp = await generateKeyPair();

    if (status) status.innerHTML = `<span class="spinner"></span> Deriving 300,000 PBKDF2 iterations…`;
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const saltB64 = b64.enc(salt.buffer);
    const aesKey = await deriveAesFromPassword(password, saltB64, PASS_ITERS);

    if (status) status.innerHTML = `<span class="spinner"></span> Sealing private key…`;
    const pubB64 = await exportPublicKey(kp.publicKey);
    const { wrapped, iv } = await wrapPrivateKey(kp.privateKey, aesKey);
    state.dek = aesKey; // kept for Quick Unlock re-enrolment from settings

    if (status) status.innerHTML = `<span class="spinner"></span> Registering mailbox…`;
    const res = await api('/register', {
      method: 'POST',
      body: JSON.stringify({
        username,
        password,
        password_confirm: confirm,
        public_key: pubB64,
        encrypted_private_key: wrapped,
        priv_iv: iv,
        priv_salt: saltB64,
        priv_iter: PASS_ITERS
      })
    });

    state.token = res.token;
    state.user = res.user;
    state.privKey = kp.privateKey;
    state.pubKey = kp.publicKey;
    state.unlocked = true;
    localStorage.setItem('inpriv_token', res.token);

    toast('Account created', `Your address is ${res.user.email}`);
    renderDashboard();
  } catch (e) {
    toast('Registration failed', e.message, 'error');
    if (btn) btn.disabled = false;
    if (status) status.textContent = '';
  }
}

function logout() {
  api('/logout', { method: 'POST' }).catch(() => {});
  state.token = null;
  state.user = null;
  state.privKey = null;
  state.pubKey = null;
  state.dek = null;
  state.unlocked = false;
  localStorage.removeItem('inpriv_token');
  toast('Signed out', 'Encryption keys wiped from browser memory.');
  renderAuth();
}

  $$('.bottom-nav .nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.nav === state.activeTab);
  });
}

/* ---------- Load & Render Messages ---------- */
async function loadMessages() {
  try {
    const data = await api('/messages');
    state.messages = data.items || [];
    updateCounts();
    renderMessageCards();
  } catch (e) {
    if (e.status === 401) {
      logout();
      return;
    }
    toast('Failed to load messages', e.message, 'error');
  }
}

function updateCounts() {
  const inb = state.messages.filter(m => m.direction === 'inbound');
  const out = state.messages.filter(m => m.direction === 'outbound');
  const unread = inb.filter(m => !m.is_read).length;

  if ($('#inboxCount')) $('#inboxCount').textContent = inb.length;
  if ($('#sentCount')) $('#sentCount').textContent = out.length;
  renderBottomNav();
}

function renderMessageCards() {
  const listArea = $('#messageListArea');
  if (!listArea) return;

  const targetDir = state.activeTab === 'inbox' ? 'inbound' : 'outbound';
  let filtered = state.messages.filter(m => m.direction === targetDir);

  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    filtered = filtered.filter(m =>
      (m.peer_address && m.peer_address.toLowerCase().includes(q)) ||
      (m.peer_label && m.peer_label.toLowerCase().includes(q)) ||
      (m.subject && m.subject.toLowerCase().includes(q))
    );
  }

  if (filtered.length === 0) {
    listArea.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${mkIcon(state.activeTab === 'inbox' ? 'inbox' : 'outbox')}</div>
        <div class="empty-state-title">${state.activeTab === 'inbox' ? 'Your inbox is clear' : 'No sent messages'}</div>
        <div class="empty-state-desc">
          ${state.activeTab === 'inbox'
            ? `Share your address <strong>${escapeHtml(state.user.email)}</strong>. Internal messages are encrypted in your browser; external inbound emails are encrypted at the gateway.`
            : 'Tap Compose to send encrypted mail to Inpriv users or external email addresses (Gmail, etc.).'}
        </div>
      </div>
    `;
    return;
  }

  listArea.innerHTML = filtered.map((m, i) => `
    <div class="msg-card ${m.is_read ? '' : 'unread'}" data-id="${m.id}" style="animation-delay:${i * 30}ms">
      <div class="msg-avatar">${initials(m.peer_label || m.peer_address)}</div>
      <div class="msg-body-meta">
        <div class="msg-top-line">
          <div class="msg-peer-name">${escapeHtml(m.peer_label || m.peer_address)}</div>
          <div class="msg-time-badge">${fmtTime(m.created_at)}</div>
        </div>
        <div class="msg-subject-line">${escapeHtml(m.subject || '(No Subject)')}</div>
      </div>
      ${!m.is_read && m.direction === 'inbound' ? '<div class="unread-indicator"></div>' : ''}
    </div>
  `).join('');

  $$('.msg-card').forEach(card => {
    card.addEventListener('click', () => openMessageView(parseInt(card.dataset.id, 10)));
  });
}

   MESSAGE READER VIEW

async function openMessageView(id) {
  const container = $('#modalContainer');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.innerHTML = `
    <div class="modal-sheet" role="dialog" aria-modal="true">
      <div class="view-sheet">
        <div class="view-header">
          <button class="icon-btn" id="viewBackBtn" title="Back">${mkIcon('arrow_back')}</button>
          <div class="view-title-wrap">
            <h2 class="view-title" id="viewSubject">Loading message…</h2>
          </div>
          <button class="icon-btn" id="viewDeleteBtn" title="Delete Message">${mkIcon('delete')}</button>
        </div>

        <div class="view-meta-box">
          <div class="view-meta-row">
            <span class="k">From</span>
            <span class="v" id="viewFrom">—</span>
          </div>
          <div class="view-meta-row">
            <span class="k">To</span>
            <span class="v" id="viewTo">—</span>
          </div>
          <div class="view-meta-row">
            <span class="k">Date</span>
            <span class="v" id="viewDate">—</span>
          </div>
        </div>

        <div class="sec-badge" id="viewSecBadge">
          ${mkIcon('verified_user')}
          <span>Zero-Knowledge Encrypted (RSA-OAEP-2048 + AES-256-GCM)</span>
        </div>

        <div class="view-body-box decrypting" id="viewBody">
          <span class="spinner"></span> Decrypting in browser memory…
        </div>

        <div class="view-actions-bar">
          <button class="btn btn-outlined" id="viewCopyBtn">${mkIcon('content_copy')} <span>Copy Body</span></button>
          <button class="btn btn-primary" id="viewReplyBtn">${mkIcon('reply')} <span>Reply</span></button>
        </div>
      </div>
    </div>
  `;
  container.appendChild(overlay);

  const close = () => {
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 320);
  };

  $('#viewBackBtn').addEventListener('click', close);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) close();
  });

  // Delete works even if fetching/decrypting the body fails below.
  $('#viewDeleteBtn').addEventListener('click', async () => {
    const ok = await confirmDialog({
      title: 'Delete this message?',
      desc: 'This permanently removes the message from your mailbox. This cannot be undone.',
      confirmLabel: 'Delete'
    });
    if (ok) {
      try {
        await api('/messages/delete', { method: 'POST', body: JSON.stringify({ id }) });
        state.messages = state.messages.filter(x => x.id !== id);
        updateCounts();
        renderMessageCards();
        toast('Message deleted', 'Removed from mailbox.');
        close();
      } catch (e) {
        toast('Delete failed', e.message, 'error');
      }
    }
  });

  try {
    const msg = await api(`/messages/${id}`);
    $('#viewSubject').textContent = msg.subject || '(No Subject)';
    $('#viewFrom').textContent = msg.direction === 'inbound' ? (msg.peer_label || msg.peer_address) : state.user.email;
    $('#viewTo').textContent = msg.direction === 'inbound' ? state.user.email : (msg.peer_label || msg.peer_address);
    $('#viewDate').textContent = new Date(msg.created_at).toLocaleString();

    const isExternalPeer = msg.peer_address && !msg.peer_address.toLowerCase().endsWith('@' + DOMAIN);
    const secEl = $('#viewSecBadge');
    if (secEl) {
      if (isExternalPeer) {
        secEl.innerHTML = `${mkIcon('public')} <span>External Email · Stored zero-knowledge encrypted in your mailbox</span>`;
      } else {
        secEl.innerHTML = `${mkIcon('verified_user')} <span>Zero-Knowledge Encrypted (RSA-OAEP-2048 + AES-256-GCM)</span>`;
      }
    }

    let decryptedText = '';
    let decryptFailed = false;
    if (!state.privKey) {
      decryptFailed = true;
      decryptedText = 'Encryption key not in browser memory. Please unlock again.';
    } else {
      try {
        decryptedText = await hybridDecrypt(state.privKey, msg);
      } catch (decErr) {
        decryptFailed = true;
        decryptedText = 'Decryption failed: ' + decErr.message;
      }
    }

    const bodyEl = $('#viewBody');
    bodyEl.classList.remove('decrypting');
    bodyEl.textContent = decryptedText;
    if (decryptFailed) {
      bodyEl.innerHTML = `<span style="color:var(--md-error)">${mkIcon('error')} ${escapeHtml(decryptedText)}</span>`;
    }

    // Mark as read in local list
    const target = state.messages.find(x => x.id === id);
    if (target && !decryptFailed) {
      target.is_read = 1;
      updateCounts();
      renderMessageCards();
    }

    $('#viewCopyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(decryptedText);
      toast('Copied to clipboard', 'Decrypted message text copied.');
    });

    $('#viewReplyBtn').addEventListener('click', () => {
      close();
      const replyTo = msg.direction === 'inbound' ? (msg.peer_address || msg.peer_label) : msg.peer_address;
      const replySub = (msg.subject && msg.subject.startsWith('Re:')) ? msg.subject : `Re: ${msg.subject || ''}`;
      openComposeModal(replyTo, replySub);
    });
  } catch (err) {
    const bodyEl = $('#viewBody');
    bodyEl.classList.remove('decrypting');
    bodyEl.innerHTML = `<span style="color:var(--md-error)">${mkIcon('error')} ${escapeHtml(err.message)}</span>`;
  }
}

/* ============================================================================
   COMPOSE MODAL
   ========================================================================== */
function openComposeModal(prefillTo = '', prefillSubject = '') {
  const container = $('#modalContainer');
  if (!container) return;
  container.innerHTML = '';

  const isPrefillExternal = prefillTo.includes('@') && !prefillTo.toLowerCase().endsWith('@' + DOMAIN);
  let initMode = isPrefillExternal ? 'external' : 'inpriv';
  const cleanTo = initMode === 'inpriv' ? String(prefillTo || '').replace(/@inpriv\.xyz$/i, '') : String(prefillTo || '');
  const cleanSubject = String(prefillSubject || '');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 class="modal-title">New Message</h2>
        <button class="icon-btn" id="composeCloseBtn" type="button" aria-label="Close">${mkIcon('close')}</button>
      </div>

      <div class="auth-segmented" id="composeModeSeg" style="margin-bottom: 14px;">
        <button type="button" class="mode-btn ${initMode === 'inpriv' ? 'active' : ''}" data-mode="inpriv">
          ${mkIcon('lock')} <span>Inpriv E2EE</span>
        </button>
        <button type="button" class="mode-btn ${initMode === 'external' ? 'active' : ''}" data-mode="external">
          ${mkIcon('public')} <span>External (Gmail, etc.)</span>
        </button>
      </div>

      <div class="sec-badge" id="composeSecBadge">
        ${initMode === 'inpriv'
          ? `${mkIcon('lock')} <span>Zero-Knowledge E2EE · Encrypted in browser with recipient's public key</span>`
          : `${mkIcon('public')} <span>External Relay · Dispatched from ${escapeHtml(state.user.email)} via secure relay. Stored encrypted in your Sent box.</span>`
        }
      </div>

      <div class="field" style="position:relative">
        <label for="cmpTo" id="cmpToLabel">${initMode === 'inpriv' ? 'To (Inpriv ID Username)' : 'To (Recipient Email Address)'}</label>
        <div class="input-wrap">
          <input type="text" id="cmpTo" placeholder="${initMode === 'inpriv' ? 'username' : 'e.g. name@gmail.com, user@outlook.com'}" autocomplete="off" autocapitalize="none" spellcheck="false" value="${escapeHtml(cleanTo)}">
          <span class="input-suffix" id="cmpSuffix" style="${initMode === 'inpriv' ? '' : 'display:none'}">@${DOMAIN}</span>
        </div>
        <div class="autocomplete-list hidden" id="cmpSuggestions"></div>
      </div>

      <div class="field">
        <label for="cmpSubject">Subject</label>
        <div class="input-wrap">
          <input type="text" id="cmpSubject" placeholder="Subject" maxlength="200" value="${escapeHtml(cleanSubject)}">
        </div>
      </div>

      <div class="field">
        <label for="cmpBody">Message</label>
        <textarea id="cmpBody" rows="7" placeholder="Type your message here…"></textarea>
      </div>

      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px">
        <button class="btn btn-outlined" id="composeCancelBtn" type="button">Cancel</button>
        <button class="btn btn-primary" id="composeSendBtn" type="button">
          ${initMode === 'inpriv' ? `${mkIcon('lock')} <span>Encrypt & Send</span>` : `${mkIcon('send')} <span>Send Email</span>`}
        </button>
      </div>
    </div>
  `;
  container.appendChild(overlay);

  // Trigger animation & focus
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.classList.add('open');
      const toInput = $('#cmpTo');
      if (toInput && !toInput.value) toInput.focus();
      else $('#cmpBody')?.focus();
    });
  });

  const close = () => {
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 320);
  };

  $('#composeCloseBtn')?.addEventListener('click', close);
  $('#composeCancelBtn')?.addEventListener('click', close);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) close();
  });

  const toInput = $('#cmpTo');
  const sugg = $('#cmpSuggestions');
  let currentMode = initMode;

  function setMode(m) {
    currentMode = m;
    $$('#composeModeSeg button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === m);
    });
    const secBadge = $('#composeSecBadge');
    const toLabel = $('#cmpToLabel');
    const suffix = $('#cmpSuffix');
    const sendBtn = $('#composeSendBtn');

    if (m === 'inpriv') {
      if (secBadge) secBadge.innerHTML = `${mkIcon('lock')} <span>Zero-Knowledge E2EE · Encrypted in browser with recipient's public key</span>`;
      if (toLabel) toLabel.textContent = 'To (Inpriv ID Username)';
      if (toInput) toInput.placeholder = 'username';
      if (suffix) suffix.style.display = '';
      if (sendBtn) sendBtn.innerHTML = `${mkIcon('lock')} <span>Encrypt & Send</span>`;
    } else {
      if (secBadge) secBadge.innerHTML = `${mkIcon('public')} <span>External Relay · Dispatched from ${escapeHtml(state.user.email)} via secure relay. Stored encrypted in your Sent box.</span>`;
      if (toLabel) toLabel.textContent = 'To (Recipient Email Address)';
      if (toInput) toInput.placeholder = 'e.g. name@gmail.com, user@outlook.com';
      if (suffix) suffix.style.display = 'none';
      if (sendBtn) sendBtn.innerHTML = `${mkIcon('send')} <span>Send Email</span>`;
      if (sugg) sugg.classList.add('hidden');
    }
  }

  $$('#composeModeSeg button').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  // Autocomplete / Input Detection
  let debTimer = null;
  toInput.addEventListener('input', () => {
    clearTimeout(debTimer);
    const raw = toInput.value.trim();
    const q = raw.toLowerCase();

    // Auto-detect external email if user pastes/types email with @ that isn't @inpriv.xyz
    if (q.includes('@') && !q.endsWith('@' + DOMAIN) && currentMode === 'inpriv') {
      setMode('external');
      return;
    }

    if (currentMode !== 'inpriv') {
      sugg.classList.add('hidden');
      return;
    }

    if (q.length < 1) {
      sugg.classList.add('hidden');
      return;
    }
    debTimer = setTimeout(async () => {
      try {
        const res = await api(`/users?q=${encodeURIComponent(q)}`);
        if (res.users && res.users.length > 0) {
          sugg.innerHTML = res.users.map(u => `
            <div class="autocomplete-item" data-u="${escapeHtml(u)}">
              <span><strong>${escapeHtml(u)}</strong>@${DOMAIN}</span>
              ${mkIcon('arrow_outward')}
            </div>
          `).join('');
          sugg.classList.remove('hidden');
          $$('.autocomplete-item', sugg).forEach(item => {
            item.addEventListener('click', () => {
              toInput.value = item.dataset.u;
              sugg.classList.add('hidden');
            });
          });
        } else {
          sugg.classList.add('hidden');
        }
      } catch (_) {
        sugg.classList.add('hidden');
      }
    }, 250);
  });

  // Send action
  $('#composeSendBtn').addEventListener('click', async () => {
    let toVal = toInput.value.trim();
    const subject = $('#cmpSubject').value.trim();
    const body = $('#cmpBody').value;

    if (!toVal) {
      toast('Recipient required', currentMode === 'inpriv' ? 'Please specify a username.' : 'Please specify an email address.', 'error');
      return;
    }
    if (!body) {
      toast('Empty message', 'Please write a message before sending.', 'error');
      return;
    }

    const sendBtn = $('#composeSendBtn');
    sendBtn.disabled = true;

    // Determine whether sending external or internal
    const isSendingExternal = currentMode === 'external' || (toVal.includes('@') && !toVal.toLowerCase().endsWith('@' + DOMAIN));

    if (isSendingExternal) {
      const emailPattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      if (!emailPattern.test(toVal)) {
        toast('Invalid email', 'Please enter a valid email address (e.g. name@gmail.com).', 'error');
        sendBtn.disabled = false;
        return;
      }

      sendBtn.innerHTML = `<span class="spinner"></span> <span>Sending…</span>`;

      try {
        // Encrypt copy for sender's Sent box
        const senderEnvelope = await hybridEncryptSingle(state.pubKey, body);

        await api('/messages/send', {
          method: 'POST',
          body: JSON.stringify({
            mode: 'external',
            to: toVal.toLowerCase(),
            subject,
            text: body,
            sender_envelope: senderEnvelope
          })
        });

        toast('Message sent', `Delivered to ${toVal.toLowerCase()}`);
        close();
        await loadMessages();
      } catch (err) {
        toast('Send failed', err.message, 'error');
        sendBtn.disabled = false;
        sendBtn.innerHTML = `${mkIcon('send')} <span>Send Email</span>`;
      }
    } else {
      let to = toVal.toLowerCase();
      if (to.endsWith('@' + DOMAIN)) to = to.slice(0, -('@' + DOMAIN).length).trim();

      sendBtn.innerHTML = `<span class="spinner"></span> <span>Encrypting…</span>`;

      try {
        // 1. Fetch recipient's public key
        const keyData = await api(`/users/${encodeURIComponent(to)}/pubkey`);
        if (!keyData.public_key) {
          throw new Error(keyData.message || 'Recipient has not generated public encryption keys yet.');
        }

        const recPubKey = await crypto.subtle.importKey(
          'spki',
          b64.dec(keyData.public_key),
          { name: 'RSA-OAEP', hash: 'SHA-256' },
          false,
          ['encrypt']
        );

        // 2. Hybrid Encrypt for both Recipient and Sender (so Sender can decrypt in Sent)
        const dual = await hybridEncryptDual(recPubKey, state.pubKey, body);

        // 3. Post to send endpoint
        await api('/messages/send', {
          method: 'POST',
          body: JSON.stringify({
            to_username: to,
            subject,
            recipient_envelope: dual.recipient_envelope,
            sender_envelope: dual.sender_envelope
          })
        });

        toast('Message sent', `Delivered encrypted to ${to}@${DOMAIN}`);
        close();
        await loadMessages();
      } catch (err) {
        toast('Send failed', err.message, 'error');
        sendBtn.disabled = false;
        sendBtn.innerHTML = `${mkIcon('lock')} <span>Encrypt & Send</span>`;
      }
    }
  });
}

      <div class="acc-info-row" style="align-items:flex-start">
        <div style="flex:1;min-width:0;padding-top:2px">
          <div class="label">Quick Unlock on this device</div>
          <div class="qu-row-sub">Skip the master password when returning to this mailbox — the unlock key is wrapped to this device and never leaves it encrypted. Applies to every service signed in with Inpriv ID.</div>
        </div>
        <div class="switch${state.user && state.user.quick_unlock !== false ? ' on' : ''}" id="swQuickUnlock" role="switch" aria-checked="${state.user && state.user.quick_unlock !== false}" tabindex="0" style="margin-left:12px;margin-top:4px"></div>
      </div>

      <div class="acc-info-row">
        <div>
          <div class="label">Encryption Standard</div>
          <div class="val">RSA-OAEP-2048 + AES-256-GCM</div>
        </div>
      </div>

      <div class="acc-info-row">
        <div>
          <div class="label">Password Protection</div>
          <div class="val">PBKDF2-SHA256 (300,000 rounds)</div>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-top:24px">

  $('#copyAddrBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(state.user.email);
    toast('Address copied', state.user.email);
  });

  // Quick Unlock toggle — flips the SAME account setting that lives in
  // Inpriv ID (user_settings.quick_unlock) through the mail backend, so the
  // switch on id.inpriv.xyz and this one always agree.
  const swQU = $('#swQuickUnlock');
  if (swQU) {
    const setSw = (on) => {
      swQU.classList.toggle('on', !!on);
      swQU.setAttribute('aria-checked', String(!!on));
    };
    const flipQU = async () => {
      const on = !swQU.classList.contains('on');
      setSw(on);
      try {
        await api('/quick-unlock', { method: 'POST', body: JSON.stringify({ enabled: on }) });
        state.user.quick_unlock = on;
        if (state.idUser) state.idUser.quick_unlock = on;
        if (!on) {
          // forget the local device key — it can no longer unwrap anything
          clearDeviceKey();
          toast('Quick Unlock off', 'Master password required on every sign-in.');
        } else {
          // re-enrol this device immediately when the DEK is still in memory
          let enrolled = false;
          if (state.dek) {
            try {
              const dk = await getDeviceKey(true);
              const wrapped = await wrapRawDek(state.dek, dk);
              await api('/device-key/set', { method: 'POST', body: JSON.stringify({ wrapped_dek: wrapped }) });
              enrolled = true;
            } catch (e) { /* enrolment retried on next password unlock */ }
          }
          toast('Quick Unlock on', enrolled
            ? 'This device will skip the master password.'
            : 'Enter your master password once to enable it on this device.');
        }
      } catch (e) {
        setSw(!on);
        toast('Could not save setting', e.message, 'error');
      }
    };
    swQU.addEventListener('click', flipQU);
    swQU.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipQU(); }
    });
  }

  $('#logoutBtn').addEventListener('click', logout);
}

/* ============================================================================
   BOOTSTRAP
   ========================================================================== */
async function bootstrap() {
  renderShell();

  const handleIdUser = (u) => {
    if (!u) return;
    state.idUser = u;
    updateIdStatusHeader();
    checkInprivIdSso();
  };

  // Listen for Inpriv ID SSO events
  window.addEventListener('inpriv:id', (ev) => {
    if (ev.detail && ev.detail.user) {
      handleIdUser(ev.detail.user);
    }
  });

  window.addEventListener('inpriv:connect', (ev) => {
    if (ev.detail && ev.detail.user) {
      handleIdUser(ev.detail.user);
      maybeAutoSso();
    }
  });

  /* ---------- Quick Sign-In (auto SSO via id.inpriv.xyz) ----------
     Fires once per page load when Inpriv ID detects a signed-in browser
     and there is no local mailbox session yet. The service backend
     redeems the grant server-to-server; the mailbox stays locked until
     the master password or the Quick Unlock device key decrypts it. */
  async function maybeAutoSso() {
    if (state.token || state.ssoTried || state.ssoBusy) return;
    if (!window.InprivID || !window.InprivID.user || typeof window.InprivID.sso !== 'function') return;
    state.ssoTried = true;
    state.ssoBusy = true;
    try {
      const g = await new Promise((res) => window.InprivID.sso(res));
      if (!g || !g.ok) return;
      const res = await fetch(API + '/sso', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ grant: g.grant, state: g.state })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        // Quick Unlock disabled server-side mid-session → drop local device key
        if (res.status === 403) clearDeviceKey();
        return;
      }
      if (d.status === 'needs_init') {
        // first visit with this Inpriv ID: prefill + ask for the password once
        toast('Inpriv ID detected', 'Enter your master password to create your mailbox keys');
        const u = $('#authUsername');
        if (u) u.value = d.username;
        const p = $('#authPassword');
        if (p) { p.focus(); p.classList.add('pulse-focus'); setTimeout(() => p.classList.remove('pulse-focus'), 800); }
        return;
      }
      if (d.status === 'totp_required') {
        toast('Two-factor required', 'Quick sign-in is disabled for 2FA accounts — sign in with your password.');
        return;
      }
      if (!d.token) return;
      // session established — mailbox still encrypted; try Quick Unlock
      state.token = d.token;
      state.user = d.user;
      localStorage.setItem('inpriv_token', d.token);
      if (!state.idUser && d.quick_unlock !== undefined) {
        // widget flag not here yet — the redeem response carries the same
        // account setting, so the unlock attempt doesn't have to wait
        state.idUser = { ...(state.idUser || {}), quick_unlock: d.quick_unlock };
      }
      await tryQuickUnlock();
    } catch (e) { /* silent — manual login always available */ }
    finally { state.ssoBusy = false; }
  }

  /* Try to decrypt the mailbox with the device key (no master password).
     Quick Unlock is governed by the Inpriv ID account setting: the widget
     publishes it with the user object; until that arrives (or when signed
     in purely locally) we fall back to the server-side policy, which knows
     the same setting through the ID database. Falls back to the unlock
     screen when unavailable/disabled. */
  async function tryQuickUnlock() {
    let allowed = state.idUser
      ? state.idUser.quick_unlock !== false
      : (state.user && typeof state.user.quick_unlock !== 'undefined')
        ? state.user.quick_unlock !== false
        : undefined;
    if (allowed === undefined) {
      try { allowed = (await api('/me', { method: 'GET' })).quick_unlock !== false; }
      catch (e) { allowed = undefined; }
    }
    if (allowed === false) { clearDeviceKey(); }
    if (allowed) {
      try {
        const dk = await getDeviceKey(false);
        if (dk) {
          const kd = await api('/device-key/get', { method: 'GET' });
          if (kd && kd.wrapped_dek) {
            const dek = await unwrapRawDek(kd.wrapped_dek, dk);
            if (dek) {
              state.dek = dek; // kept for Quick Unlock re-enrolment from settings
              state.privKey = await unwrapPrivateKey(state.user.encrypted_private_key, state.user.priv_iv, dek);
              state.pubKey = await crypto.subtle.importKey('spki', b64.dec(state.user.public_key), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
              state.unlocked = true;
              toast('Mailbox unlocked', 'Quick Unlock via Inpriv ID — no password needed.');
              renderDashboard();
              return;
            }
          }
        }
      } catch (e) { /* fall through to password screen */ }
    }
    // locked session: show the unlock screen (password still required)
    toast('Signed in with Inpriv ID', 'Enter your master password to unlock the mailbox.');
    promptUnlockSession();
  }

  // session restore: existing token → try device key first, then password
  if (state.token) {
    try {
      const me = await api('/me', { method: 'GET' });
      state.user = me;
      await tryQuickUnlock();
    } catch (e) {
      state.token = null;
      localStorage.removeItem('inpriv_token');
      renderAuth();
    }
  }

  if (window.InprivID) {
    if (window.InprivID.user) {
      handleIdUser(window.InprivID.user);
    } else if (typeof window.InprivID.check === 'function') {
      window.InprivID.check(handleIdUser);
    }
  }

  // Universal delegate for compose actions
  document.addEventListener('click', (e) => {
    const composeBtn = e.target.closest('#mobileComposeBtn, #desktopFab, [data-action="compose"]');
    if (composeBtn) {
      e.preventDefault();
      openComposeModal();
    }
  });

  // URL parameters: start on the register card when ?register is present
  const urlParams = new URLSearchParams(window.location.search);
  const initialMode = urlParams.get('register') ? 'register' : 'login';

  // no session → plain auth card. (Signed-in visitors were already handled
  // above by the session-restore block, including the Quick Unlock path.)
  if (!state.token) renderAuth(initialMode);
}

function promptUnlockSession() {
  $('#bottomNavContainer').innerHTML = '';
  $('#fabContainer').innerHTML = '';
  updateIdStatusHeader();

  const main = $('#mainView');
  main.innerHTML = `
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-header">
          <div class="auth-header-icon">${mkIcon('lock')}</div>
          <h1 class="auth-title">Unlock Mailbox</h1>
          <p class="auth-subtitle">Signed in as <strong>${escapeHtml(state.user.email)}</strong>. Enter your master password to unlock your private key locally.</p>
        </div>

        <form id="sessionUnlockForm">
          <div class="field">
            <label>Master Password</label>
            <div class="input-wrap">
              <input type="password" id="sessionPw" placeholder="Master password" autocomplete="current-password" required autofocus>
              <button type="button" class="eye-toggle" data-target="sessionPw">${mkIcon('visibility')}</button>
            </div>
          </div>

          <div class="sec-badge">
            ${mkIcon('memory')}
            <span>Keys are decrypted only in your device's memory</span>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="sessionUnlockBtn">
            <span>Unlock Private Key</span> ${mkIcon('lock_open')}
          </button>

          <div style="text-align:center;margin-top:14px">
            <button type="button" class="btn btn-text" id="sessionSignOutBtn">Sign out instead</button>
          </div>
        </form>
      </div>
    </div>
  `;

  bindEyeToggles();
  $('#sessionSignOutBtn').addEventListener('click', logout);

  $('#sessionUnlockForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('#sessionPw').value;
    const btn = $('#sessionUnlockBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> <span>Unlocking…</span>`;

    try {
      const aesKey = await deriveAesFromPassword(pw, state.user.priv_salt, state.user.priv_iter);
      state.dek = aesKey; // kept for Quick Unlock re-enrolment from settings
      state.privKey = await unwrapPrivateKey(state.user.encrypted_private_key, state.user.priv_iv, aesKey);
      state.pubKey = await crypto.subtle.importKey('spki', b64.dec(state.user.public_key), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
      state.unlocked = true;

      // the wrapped DEK was missing/stale — enrol this device NOW so the
      // next visit skips the master password entirely
      try { await enrolQuickUnlock(aesKey); } catch (e) {}

      toast('Unlocked', 'Private key decrypted in memory.');
      renderDashboard();
    } catch (err) {
      toast('Invalid password', 'Could not decrypt private key.', 'error');
      btn.disabled = false;
      btn.innerHTML = `<span>Unlock Private Key</span> ${mkIcon('lock_open')}`;
    }
  });
}

document.addEventListener('DOMContentLoaded', bootstrap);
})();
</script>
</body>
</html>
