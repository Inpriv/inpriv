/* ---------- 1. COLOR TOKENS (M3) ---------- */
:root,
[data-theme="dark"] {
  --md-primary: #CBBEFF;
  --md-on-primary: #340098;
  --md-primary-container: #4B21BD;
  --md-on-primary-container: #E6DEFF;

  --md-secondary: #C6C4DE;
  --md-on-secondary: #313049;
  --md-secondary-container: #45425C;
  --md-on-secondary-container: #E2E0F1;

  --md-tertiary: #FFB868;
  --md-on-tertiary: #4E2800;
  --md-tertiary-container: #4E3655;
  --md-on-tertiary-container: #F5D9FC;

  --md-error: #FF8670;
  --md-on-error: #490909;

  --md-surface: #141218;
  --md-on-surface: #E6E1E3;
  --md-on-surface-variant: #CBC4D4;

  --md-surface-dim: #141218;
  --md-surface-container-lowest: #0F0E13;
  --md-surface-container-low: #1F1D24;
  --md-surface-container: #242229;
  --md-surface-container-high: #2F2C33;
  --md-surface-container-highest: #3A373F;

  --md-shadow-strong: rgba(0, 0, 0, 0.65);

  --md-scrim: rgba(0, 0, 0, 0.55);
  --dot-color: rgba(195, 200, 182, 0.10);
  --blob-a: rgba(46, 79, 47, 0.55);
  --blob-b: rgba(126, 45, 30, 0.40);
  color-scheme: dark;
}

  --md-primary: #9F86FF;
  --md-on-primary: #FFFFFF;

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Roboto Flex','Google Sans Text',system-ui,sans-serif;background:var(--md-surface);color:var(--md-on-surface);display:flex;flex-direction:column;min-height:100dvh}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1320px;width:100%;margin-inline:auto;padding:16px 16px 0}
@media(min-width:600px){.bar{padding:22px 24px 0}}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-title{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.brand-title .accent{color:var(--md-primary)}
.brand-tagline{font-size:12px;color:var(--md-on-surface-variant);font-weight:500;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
@media(max-width:599px){.brand-title{font-size:20px}.brand-tagline{display:none}}
.actions{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--md-secondary-container);color:var(--md-on-secondary-container);font-size:12.5px;font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);color:var(--md-on-surface);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--md-surface-container-high)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .icon-sun{display:none}[data-theme="light"] .icon-moon{display:none}

.wrap{max-width:1320px;width:100%;margin-inline:auto;padding:14px 16px 0;display:flex;flex-direction:column;flex:1;min-height:0}
@media(min-width:600px){.wrap{padding:16px 24px 0}}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 18px;border-radius:14px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container-low);color:var(--md-on-surface-variant);cursor:pointer;font:inherit;text-align:left}
.tab b{font-size:15px;font-weight:600;color:var(--md-on-surface)}
.tab small{font-size:11.5px}
.tab:hover{background:var(--md-surface-container)}
.tab[aria-selected="true"]{background:var(--md-primary-container);border-color:transparent}
.tab[aria-selected="true"] b,.tab[aria-selected="true"] small{color:var(--md-on-primary-container)}
.tab:focus-visible{outline:2px solid var(--md-primary);outline-offset:2px}

.drop{flex:none;margin-top:12px;border:2px dashed var(--md-outline);border-radius:20px;padding:22px 16px;text-align:center;cursor:pointer;background:var(--md-surface-container-low);transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--md-surface-container);border-color:var(--md-primary)}
.drop strong{display:block;font-size:16px;margin-bottom:2px}
.drop span{font-size:13px;color:var(--md-on-surface-variant)}
.chip{flex:none;margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 8px 8px 16px;border-radius:999px;background:var(--md-surface-container);font-size:13.5px}
.chip[hidden],.drop[hidden]{display:none}
.chip .name{font-weight:600;max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{font:inherit;font-size:13px;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.chip button:hover{filter:brightness(1.08)}
.hint{flex:none;margin-top:10px;font-size:12.5px;color:var(--md-on-surface-variant);min-height:1.3em}

.stage{flex:1;margin-top:12px;min-height:70dvh;border-radius:20px 20px 0 0;overflow:hidden;background:var(--md-surface);border:1px solid var(--md-outline-variant);border-bottom:0;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:none}
.stage iframe.active{display:block}
.foot{text-align:center;font-size:11.5px;color:var(--md-on-surface-variant);padding:8px 16px;border-top:1px solid var(--md-outline-variant)}
.foot a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>
<header class="bar">
  <div class="brand"><div class="brand-title">image<span class="accent">.</span></div><div class="brand-tagline">Inpriv Labs</div></div>
  <div class="actions">
    <div class="pill"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>100% Local</div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle color theme" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist" aria-label="Image tools">
    <button class="tab" role="tab" data-mode="wipe" aria-selected="true"><b>Wipe</b><small>EXIF · GPS · XMP</small></button>
    <button class="tab" role="tab" data-mode="compress" aria-selected="false"><b>Compress</b><small>Shrink + strip metadata</small></button>
    <button class="tab" role="tab" data-mode="censor" aria-selected="false"><b>Censor</b><small>Blur · pixelate · redact</small></button>
    <button class="tab" role="tab" data-mode="stego" aria-selected="false"><b>Stego</b><small>Hide data in an image</small></button>
  </div>

  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose images">
    <strong>Drop images here or click to choose</strong>
    <span>The same file(s) are used in every tab. Nothing is uploaded.</span>
  </div>
  <div class="chip" id="chip" hidden>
    <span class="name" id="chipName"></span><span id="chipMeta"></span>
    <button type="button" id="replace">Replace</button><button type="button" id="clear">Clear</button>
  </div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <input class="sr" type="file" id="picker" accept="image/*" multiple tabindex="-1">

  <div class="stage" id="stage"></div>
</main>
<div class="foot">Everything runs in your browser · no uploads · no trackers · <a href="https://inpriv.xyz/">inpriv.xyz</a></div>

<script>
(function () {
  var MODES = ['wipe', 'compress', 'censor', 'stego'];
  var HINTS = {
    wipe: 'Shows every EXIF / GPS / XMP tag, then removes it and verifies the result.',
    compress: 'Compress re-encodes the pixels, so EXIF, GPS and XMP are dropped in the same pass.',
    censor: 'Blur, pixelate or black out faces, text and regions.',
    stego: 'Stego works with one image at a time (the first file is used).'
  };
  var stage = document.getElementById('stage');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var drop = document.getElementById('drop'), chip = document.getElementById('chip');
  var picker = document.getElementById('picker'), hint = document.getElementById('hint');
  var files = [], frames = {}, ready = {}, sent = {}, current = null, version = 0;

  function post(mode, msg) {
    var f = frames[mode];
    if (f && ready[mode] && f.contentWindow) f.contentWindow.postMessage(msg, location.origin);
  }
  function theme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('inpriv_theme', t); localStorage.setItem('inpriv-theme', t); } catch (e) {}
    MODES.forEach(function (m) { post(m, { type: 'inpriv-theme', theme: t }); });
  }
  var saved = null;
  try { saved = localStorage.getItem('inpriv_theme') || localStorage.getItem('inpriv-theme'); } catch (e) {}
  if (!saved) saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').addEventListener('click', function () {
    theme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  function deliver(mode) {
    if (!files.length || !ready[mode] || sent[mode] === version) return;
    sent[mode] = version;
    post(mode, { type: 'inpriv-files', files: files.slice() });
  }
  function ensureFrame(mode) {
    if (frames[mode]) return;
    var f = document.createElement('iframe');
    f.title = mode;
    f.src = '/m/' + mode + '/?embed=1';
    stage.appendChild(f);
    frames[mode] = f;
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'inpriv-ready') return;
    var m = e.data.mode; ready[m] = true;
    post(m, { type: 'inpriv-theme', theme: document.documentElement.getAttribute('data-theme') });
    deliver(m);
  });

  function show(mode, push) {
    if (MODES.indexOf(mode) < 0) mode = 'wipe';
    current = mode; ensureFrame(mode);
    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.mode === mode)); });
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('active', k === mode); });
    hint.textContent = HINTS[mode];
    document.title = 'Inpriv Image — ' + mode.charAt(0).toUpperCase() + mode.slice(1);
    if (push !== false && location.hash !== '#' + mode) history.replaceState(null, '', '#' + mode);
    deliver(mode);
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.mode); }); });

  function setFiles(list) {
    list = Array.prototype.slice.call(list).filter(function (f) {
      return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|avif|tiff?|heic)$/i.test(f.name);
    });
    if (!list.length) { hint.textContent = 'Please choose image files (JPG, PNG, WebP, AVIF, TIFF…).'; return; }
    files = list; version++; sent = {};
    drop.hidden = true; chip.hidden = false;
    var total = list.reduce(function (n, f) { return n + f.size; }, 0);
    document.getElementById('chipName').textContent = list.length === 1 ? list[0].name : list.length + ' images';
    document.getElementById('chipMeta').textContent = (total >= 1048576 ? (total / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(total / 1024)) + ' KB');
    hint.textContent = HINTS[current];
    deliver(current);
  }
  function clearFiles() { files = []; version++; sent = {}; chip.hidden = true; drop.hidden = false; picker.value = ''; }

  drop.addEventListener('click', function () { picker.click(); });
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); } });
  document.getElementById('replace').addEventListener('click', function () { picker.click(); });
  document.getElementById('clear').addEventListener('click', clearFiles);
  picker.addEventListener('change', function () { if (picker.files.length) setFiles(picker.files); picker.value = ''; });
  ['dragenter', 'dragover'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  document.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) setFiles(e.dataTransfer.files); });

  function fromLocation() {
    var m = (location.hash || '').replace('#', '') || new URLSearchParams(location.search).get('mode');
    return MODES.indexOf(m) >= 0 ? m : 'wipe';
  }
  window.addEventListener('hashchange', function () { show(fromLocation(), false); });
  show(fromLocation(), false);

  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
})();
</script>
