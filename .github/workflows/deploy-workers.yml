# Deploys each Cloudflare Worker when its folder (or the shared common/ code)
# changes on main. Run it by hand from the Actions tab to redeploy one or all.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the Workers live in
#
# Pages are deployed exactly as committed. After editing common/ui or a page
# source, run `node common/ui/sync.mjs` and commit the copies it writes.
name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to deploy
        type: choice
        default: all
        options: [all, inpriv, inpriv-admin, inpriv-id, inpriv-mail, inpriv-status, inpriv-temp]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  changes:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.pick.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            inpriv:
              - 'worker/**'
              - 'common/*.js'
            inpriv-admin:
              - '.admin/worker/**'
              - 'common/*.js'
            inpriv-id:
              - '.id/worker/**'
              - 'common/*.js'
            inpriv-mail:
              - '.mail/worker/**'
              - 'common/*.js'
            inpriv-status:
              - '.status/worker/**'
              - 'common/*.js'
            inpriv-temp:
              - '.temp/worker/**'
              - 'common/*.js'
      - id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          CHOSEN: ${{ inputs.worker }}
        run: |
          all='["inpriv","inpriv-admin","inpriv-id","inpriv-mail","inpriv-status","inpriv-temp"]'
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$CHOSEN" = "all" ]; then echo "workers=$all"; else echo "workers=[\"$CHOSEN\"]"; fi
          else
            echo "workers=${CHANGED:-[]}"
          fi >> "$GITHUB_OUTPUT"

  # Migrations are applied by hand: D1 cannot add a column twice, so a blind
  # `d1 migrations apply` against an already-migrated database fails. This job
  # is the other half of that arrangement — it refuses to deploy code whose
  # schema is not in production yet. `node tests/migrations-check.mjs` (part of
  # `npm run check`) keeps the migrations and schema.sql in step.
  schema:
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the columns this code needs exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          have() { # worker-dir, database, sql, needle
            local out
            out=$(cd "$1" && npx --yes wrangler@4.83.0 d1 execute "$2" --remote --json --command "$3" 2>/dev/null)
            if ! printf '%s' "$out" | grep -q "$4"; then
              echo "::error::missing $4 in $2 — apply the migration before deploying"
              exit 1
            fi
            echo "ok: $4"
          }
          col() { have "$1" "$2" "SELECT name FROM pragma_table_info('$3') WHERE name='$4'" "$4"; }
          col .id/worker   inpriv-id   users    show_address
          col .id/worker   inpriv-id   users    suggest_address
          col .mail/worker inpriv-mail messages peer_masked
          col .mail/worker inpriv-mail messages unsubscribe
          have .mail/worker inpriv-mail "SELECT name FROM sqlite_master WHERE type='table' AND name='blocked_senders'" blocked_senders

  deploy:
    needs: [changes, ci, schema]
    if: needs.changes.outputs.workers != '[]' && needs.changes.outputs.workers != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    concurrency:
      group: deploy-${{ matrix.worker }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: dir
        run: |
          case "${{ matrix.worker }}" in
            inpriv)       echo "path=worker" ;;
            inpriv-admin) echo "path=.admin/worker" ;;
            inpriv-id)    echo "path=.id/worker" ;;
            inpriv-mail)  echo "path=.mail/worker" ;;
            inpriv-status) echo "path=.status/worker" ;;
            inpriv-temp)  echo "path=.temp/worker" ;;
          esac >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.83.0"
          workingDirectory: ${{ steps.dir.outputs.path }}
          command: deploy
