name = "inpriv-send"
main = "src/index.js"
compatibility_date = "2025-08-01"
workers_dev = true

routes = [
  { pattern = "send.inpriv.xyz", custom_domain = true }
]

# Backends: /burn/api/* -> inpriv-burn, /share/api/* -> inpriv-share
[[services]]
binding = "BURN"
service = "inpriv-burn"

[[services]]
binding = "SHARE"
service = "inpriv-share"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
