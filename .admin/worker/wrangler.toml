name = "inpriv-admin"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# routes must stay above the first [table] entry
routes = [
  { pattern = "admin.inpriv.xyz", custom_domain = true }
]

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "MAINTENANCE"
id = "37e2feceae474e21a0b9664c9bdfdea3"

# Host review queue — storage limit requests from host.inpriv.xyz
[[d1_databases]]
binding = "HOST_DB"
database_name = "inpriv-host"
database_id = "f6286739-fdfb-4fae-9148-377496175489"

# Resolve requesters to usernames (accounts live in Inpriv ID)
[[d1_databases]]
binding = "ID_DB"
database_name = "inpriv-id"
database_id = "1cd1ca2e-51fd-40d9-94d8-aa75f989291b"

# secrets (wrangler secret put …):
#   TOTP_SECRET — base32 secret for Google Authenticator (user: saloyek)
