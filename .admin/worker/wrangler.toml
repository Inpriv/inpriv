name = "inpriv-admin"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

# routes must stay above the first [table] entry
routes = [
  { pattern = "admin.inpriv.xyz", custom_domain = true }
]

# No cron for admin itself (Free plan slots are taken); its own stale-file
# sweep runs lazily on authenticated requests, and the /api/sweep endpoint
# (called with X-Sweep-Secret) cleans burn/share/status on demand.

[assets]
directory = "./public"
not_found_handling = "single-page-application"

# Storage: table admin_kv in the inpriv-id D1 database (ID_DB binding below).
# Google Drive ("inpriv/.admin", user OAuth) is only read once, to import the
# old state.json when admin_kv is still empty.
[vars]
DRIVE_PARENT = "1yLBrRjNDorTiBgGwQ12krHavKGLshFmV"
DRIVE_FOLDER_NAME = ".admin"

# Admin storage (admin_kv) and Inpriv ID accounts
[[d1_databases]]
binding = "ID_DB"
database_name = "inpriv-id"
database_id = "1cd1ca2e-51fd-40d9-94d8-aa75f989291b"

# secrets (wrangler secret put …):
#   TOTP_SECRET  — base32 secret for Google Authenticator (user: saloyek)
#   DRIVE_OAUTH  — {"client_id":"…","client_secret":"…","refresh_token":"…"}
