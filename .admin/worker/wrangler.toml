name = "inpriv-admin"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = false

# routes must stay above the first [table] entry
routes = [
  { pattern = "admin.inpriv.xyz", custom_domain = true }
]

# No cron for admin itself (Free plan slots are taken); its own stale-file
# sweep runs lazily on authenticated requests, and the /api/sweep endpoint
# (called with X-Sweep-Secret) cleans burn/share/status on demand.

# run_worker_first: the Worker serves the page too, so http:// is redirected
# to https:// and every response gets the security headers
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Storage: table admin_kv in the inpriv-id D1 database (ID_DB binding below).
# Google Drive ("inpriv/.admin", user OAuth) is only read once, to import the
# old state.json when admin_kv is still empty.
[vars]
DRIVE_PARENT = "1yLBrRjNDorTiBgGwQ12krHavKGLshFmV"
DRIVE_FOLDER_NAME = ".admin"

# Admin storage (admin_kv) and Inpriv ID accounts
[[d1_databases]]
binding = "ID_DB"
database_name = "inpriv-id"
database_id = "1cd1ca2e-51fd-40d9-94d8-aa75f989291b"

# Records (read-only lookups) and team mailboxes
[[d1_databases]]
binding = "MAIL_DB"
database_name = "inpriv-mail"
database_id = "d5c75cf0-46ba-4721-99fc-da18d2ccbabe"

[[d1_databases]]
binding = "TEMP_DB"
database_name = "inpriv-temp"
database_id = "4fd698d2-c51e-4390-8f6b-9968f5da902d"

# Team mailboxes (support@, abuse@ …) live in Mail; admin reaches them through
# this binding, which isn't reachable from the internet.
[[services]]
binding = "TEAM"
service = "inpriv-mail"
entrypoint = "TeamMail"

# secrets (wrangler secret put …):
#   ADMIN_USER   — the admin sign-in username
#   TOTP_SECRET  — base32 secret for Google Authenticator
#   DRIVE_OAUTH  — {"client_id":"…","client_secret":"…","refresh_token":"…"}
