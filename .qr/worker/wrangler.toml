name = "inpriv-qr-api"
main = "src/index.js"
compatibility_date = "2025-08-01"
workers_dev = true

# Custom domain — serves both the QR tool and the API
routes = [
  { pattern = "qr.inpriv.xyz", custom_domain = true }
]

# Static frontend served from ./public (the QR generator/reader tool)
[assets]
directory = "./public"
binding = "ASSETS"
