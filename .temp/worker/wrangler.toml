name = "temp"
main = "src/index.js"
compatibility_date = "2025-08-01"
workers_dev = true

# Custom domain — serves the Temp tool on temp.inpriv.xyz
routes = [
  { pattern = "temp.inpriv.xyz", custom_domain = true }
]

# Hourly cleanup of expired mailboxes and stale messages
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "inpriv-temp"
database_id = "412454d1-f9e8-43a4-85f6-6101f4ad1e06"

# Static frontend served from ./public (the single-file temp-mail tool)
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
DOMAIN = "inpriv.xyz"
