name = "inpriv-temp"
main = "src/index.js"
compatibility_date = "2025-08-01"
workers_dev = true

# Custom domain — serves the Temp tool on temp.inpriv.xyz
# (routes MUST stay above the first [table] — see cloudflare-workers skill)
routes = [
  { pattern = "temp.inpriv.xyz", custom_domain = true }
]

# Hourly cleanup of expired mailboxes and stale messages
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "inpriv-temp"
database_id = "4fd698d2-c51e-4390-8f6b-9968f5da902d"

# Cross-check: custom mailbox names must not collide with Inpriv ID accounts
[[d1_databases]]
binding = "ID_DB"
database_name = "inpriv-id"
database_id = "1cd1ca2e-51fd-40d9-94d8-aa75f989291b"

# Static frontend served from ./public (the single-file temp-mail tool)
# run_worker_first: the worker MUST run on every request so the kill-switch
# can replace the page with a maintenance screen
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Admin kill-switch state (admin.inpriv.xyz worker shares this namespace)
[[kv_namespaces]]
binding = "MAINTENANCE"
id = "37e2feceae474e21a0b9664c9bdfdea3"

[vars]
DOMAIN = "inpriv.xyz"

# Secrets (set via `npx wrangler secret put <NAME>`):
#   RESEND_API_KEY        — Resend key for outbound sends (send access is enough)
#   RESEND_READ_API_KEY   — optional: read-capable key to fetch received bodies
#                           (without it, messages are stored with metadata only)
#   RESEND_WEBHOOK_SECRET — whsec_… signing secret of the email.received webhook
