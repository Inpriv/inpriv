<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ebe9e4" media="(prefers-color-scheme: light)">
<style id="inpriv-startup">html { background: #0c0c0b; color-scheme: dark; }</style>
<script id="inpriv-pwa">
/* Installed-app startup: paint before the UI core loads, then stay in sync. */
(function () {
  'use strict';
  var root = document.documentElement;
  var system = window.matchMedia('(prefers-color-scheme: light)');
  var standalone = window.matchMedia('(display-mode: standalone)');
  try {
    var saved = localStorage.getItem('inpriv_theme') || localStorage.getItem('inpriv-theme');
    if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
  } catch (e) {}
  function paint() {
    var theme = root.dataset.theme || (system.matches ? 'light' : 'dark');
    var color = theme === 'light' ? '#ebe9e4' : '#0c0c0b';
    root.style.backgroundColor = color;
    root.style.colorScheme = theme;
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
      meta.content = color;
    });
    // In an app window, the brand is this app's home, not another origin.
    var brand = document.querySelector('.top .brand');
    if (brand && (standalone.matches || navigator.standalone === true)) {
      brand.href = '/';
      var name = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      brand.setAttribute('aria-label', (name ? name.content : 'Inpriv') + ' home');
    }
  }
  paint();
  window.addEventListener('inpriv:theme', paint);
  window.addEventListener('pageshow', paint);
  if (system.addEventListener) system.addEventListener('change', paint);
  var deferred = null, installed = false, installing = false;
  function state() {
    return { installed: installed || standalone.matches || navigator.standalone === true, installing: installing, canPrompt: !!deferred };
  }
  function changed() {
    window.dispatchEvent(new CustomEvent('inpriv:pwa', { detail: state() }));
  }
  window.addEventListener('beforeinstallprompt', function (event) {
    if (!root.hasAttribute('data-install-ui')) return;
    event.preventDefault();
    deferred = event; installing = false; changed();
  });
  window.addEventListener('appinstalled', function () {
    installed = true; installing = false; deferred = null; changed();
  });
  if (standalone.addEventListener) standalone.addEventListener('change', changed);
  window.InprivPWA = {
    state: state,
    install: async function () {
      if (state().installed) return 'installed';
      if (installing) return 'pending';
      if (!deferred) return 'unavailable';
      var event = deferred;
      deferred = null; installing = true; changed();
      try {
        // Invoke the prompt before awaiting anything, while the tap is active.
        var choice = await event.prompt();
        if (!choice || !choice.outcome) choice = await event.userChoice;
        installing = !!(choice && choice.outcome === 'accepted' && !installed);
        changed();
        return choice && choice.outcome || 'dismissed';
      } catch (e) { installing = false; changed(); return 'unavailable'; }
    }
  };
  window.addEventListener('load', function () {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).catch(function () {});
    }
  });
})();
</script>
<title>Inpriv — Offline</title>
<style>
:root { --paper: #0c0c0b; --ink: #f2f1ed; --muted: #a8a69f; --line: #343432; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --paper: #ebe9e4; --ink: #141412; --muted: #63625d; --line: #ceccc6; } }
:root[data-theme="light"] { --paper: #ebe9e4; --ink: #141412; --muted: #63625d; --line: #ceccc6; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: var(--paper); color: var(--ink); font: 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
main { width: min(100%, 400px); padding: 28px; border: 1px solid var(--line); border-radius: 28px; }
svg { width: 28px; height: 40px; fill: currentColor; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.03em; margin: 24px 0 10px; }
p { color: var(--muted); margin: 0 0 24px; }
button { min-height: 48px; width: 100%; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1.2; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
</style></head><body>
<main><svg viewBox="0 0 28 40" aria-hidden="true"><path d="M14 0 0 19h28zM0 22l14 18 14-18z"/></svg>
<h1>You're offline.</h1><p>Connect to the internet to use Inpriv. We'll try again when you're back online.</p>
<button type="button" id="retry">Try again</button></main>
<script>document.getElementById('retry').addEventListener('click', function () { location.reload(); }); window.addEventListener('online', function () { location.reload(); });</script>
</body></html>
